<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Englisch-Trainer 3. Klasse Bayern</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<link rel="icon" type="image/png" href="../images/icon_eng.png">
<link rel="apple-touch-icon" href="../images/icon_eng.png">
<style>
:root {
  --bg: #f5f0fa;
  --card: #ffffff;
  --accent: #8e44ad;
  --accent-soft: #ede0f7;
  --accent-dark: #6c3483;
  --danger: #e74c3c;
  --danger-soft: #fde8e8;
  --success: #27ae60;
  --success-soft: #d5f5e3;
  --warning: #f1c40f;
  --text: #222222;
  --muted: #666666;
  --radius: 18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;touch-action:manipulation}
.app{width:100%;max-width:1100px;padding:12px}
@media(min-width:768px){.app{padding:24px}}
.hidden{display:none!important}

/* ── CARD ── */
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,0.08);padding:16px}
@media(min-width:768px){.card{padding:24px}}

/* ── HEADER ── */
.header{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.back-home{background:#ecf0f1;border:none;border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center;transition:background .2s;text-decoration:none;flex-shrink:0}
.back-home:hover{background:#bdc3c7}
.back-home svg{width:22px;height:22px}
.app-icon{width:56px;height:56px;border-radius:14px;object-fit:cover;box-shadow:0 4px 10px rgba(0,0,0,0.1);flex-shrink:0}
.header-text h1{font-size:20px;margin-bottom:3px;color:#2c3e50}
.header-text p{font-size:13px;color:var(--muted)}
@media(max-width:500px){.header-text h1{font-size:17px}.app-icon{width:44px;height:44px}}

/* ── BARS ── */
.profile-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.child-badge{display:flex;align-items:center;gap:8px;background:var(--accent-soft);border:2px solid #d7b8f0;border-radius:12px;padding:8px 14px}
.child-badge svg{width:16px;height:16px;stroke:var(--accent);flex-shrink:0}
.child-badge span{font-weight:bold;font-size:14px;color:var(--accent-dark)}
.coin-badge{display:flex;align-items:center;gap:6px;background:#fef9e7;border:2px solid #f39c12;border-radius:12px;padding:8px 14px;font-weight:bold;font-size:15px;color:#7d5a00}
.score-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:14px;background:var(--accent-soft);font-size:13px;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.score-bar strong{font-size:16px;color:var(--accent-dark);display:flex;align-items:center;gap:6px}
.score-chips{display:flex;gap:8px;flex-wrap:wrap}
.score-chip{padding:4px 12px;border-radius:20px;font-weight:bold;font-size:13px}
.chip-ok{background:var(--success-soft);color:#1a6e40}
.chip-bad{background:var(--danger-soft);color:#922b21}

/* ── MAIN LAYOUT ── */
.main-layout{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}
@media(max-width:860px){.main-layout{grid-template-columns:1fr}}

/* ── TOPIC TILES ── */
.panel-title{font-size:15px;font-weight:bold;color:#2c3e50;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.tile-grid{display:grid;grid-template-columns:1fr;gap:8px}
@media(max-width:860px){.tile-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
.tile{background:#f9f4fd;border-radius:12px;padding:10px 12px;border:2px solid #dbb8f0;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:10px}
.tile:hover,.tile.active{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px);box-shadow:0 3px 8px rgba(142,68,173,0.15)}
.tile-icon{font-size:22px;flex-shrink:0}
.tile-text{min-width:0}
.tile-title{font-size:13px;font-weight:bold;color:#2c3e50;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-sub{font-size:10px;color:var(--muted);margin-top:1px}
@media(max-width:860px){.tile{flex-direction:column;text-align:center;padding:10px 8px;gap:4px}.tile-text{width:100%}.tile-title{white-space:normal;font-size:12px}}

/* ── EXERCISE PANEL ── */
.view-container{display:none}
.view-container.active{display:block}
.default-hint{text-align:center;padding:40px 20px;color:var(--muted)}
.default-hint .default-icon{font-size:56px;margin-bottom:14px}
.default-hint p{font-size:15px;line-height:1.5}

/* ── TOPIC HEADER ── */
.topic-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:14px;border-bottom:2px solid var(--accent-soft)}
.topic-header-icon{font-size:36px;line-height:1}
.topic-header-title{font-size:20px;font-weight:bold;color:#2c3e50}
.topic-header-en{font-size:13px;color:var(--muted)}
.word-count-badge{margin-left:auto;background:var(--accent-soft);color:var(--accent-dark);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:bold;white-space:nowrap}

/* ── WORD GRID (Entdecken) ── */
.discover-toggle{width:100%;background:none;border:2px dashed #dbb8f0;border-radius:12px;padding:10px;font-size:13px;font-weight:bold;color:var(--accent);cursor:pointer;margin-bottom:12px;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.discover-toggle:hover{background:var(--accent-soft);border-style:solid}
.word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.word-tile{background:#f9f4fd;border:1px solid #dbb8f0;border-radius:10px;padding:10px 10px 8px;cursor:pointer;transition:all .15s;text-align:center}
.word-tile:hover{background:var(--accent-soft);border-color:var(--accent);transform:translateY(-1px)}
.word-tile-en{font-size:14px;font-weight:bold;color:#2c3e50;margin-bottom:3px}
.word-tile-de{font-size:11px;color:var(--muted)}
.word-tile-speaker{font-size:14px;margin-top:4px}

/* ── MODE TABS ── */
.mode-tabs{display:flex;gap:6px;margin-bottom:14px;background:#f0e8f8;padding:4px;border-radius:12px;flex-wrap:wrap}
.mode-tab{flex:1;min-width:0;padding:9px 6px;border:none;background:transparent;border-radius:9px;font-size:12px;font-weight:bold;color:#95a5a6;cursor:pointer;transition:all .15s;white-space:nowrap;font-family:inherit}
.mode-tab.active{background:var(--card);color:var(--accent);box-shadow:0 2px 6px rgba(0,0,0,0.08)}
.mode-tab:hover:not(.active){color:var(--accent)}

/* ── TASK BOX ── */
.task-box{padding:20px;border-radius:14px;background:#fdfaff;border:2px solid #dbb8f0;text-align:center;margin-bottom:14px}
.task-question{font-size:19px;font-weight:bold;color:#2c3e50;line-height:1.4;margin-bottom:6px}
.task-hint{font-size:13px;color:var(--muted);line-height:1.4}
.question-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px}

/* ── SPEAKER BUTTON ── */
.speaker-btn{background:var(--accent-soft);color:var(--accent);border:none;border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s;flex-shrink:0}
.speaker-btn:active{transform:scale(0.88)}
.speaker-btn svg{width:20px;height:20px}

/* ── FLASHCARD ── */
.flashcard{border-radius:16px;padding:28px 20px;text-align:center;cursor:pointer;transition:transform .1s ease,box-shadow .15s ease;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;user-select:none;margin-bottom:12px;border:2px solid var(--accent)}
.flashcard.front-visible{background:var(--accent-soft)}
.flashcard.back-visible{background:#e8f8f5;border-color:#27ae60}
.flashcard:active{transform:scale(0.97)}
.fc-label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:bold}
.fc-word{font-size:2rem;font-weight:bold;color:#2c3e50;line-height:1.2}
.fc-example{font-size:13px;color:var(--muted);font-style:italic;max-width:32ch;line-height:1.5}
.fc-tip{font-size:12px;color:var(--accent);margin-top:2px}
.fc-speak-btn{margin-top:6px;padding:7px 16px;background:#27ae60;color:white;border:none;border-radius:20px;font-size:13px;font-weight:bold;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit}
.fc-speak-btn:active{transform:scale(0.95)}
.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}

/* ── MULTIPLE CHOICE ── */
.mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media(max-width:480px){.mc-grid{grid-template-columns:1fr}}
.mc-btn{padding:14px 12px;border-radius:12px;border:2px solid #dbb8f0;background:white;color:#2c3e50;font-size:14px;font-weight:bold;cursor:pointer;transition:all .12s;text-align:left;font-family:inherit}
.mc-btn:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.mc-btn.correct{background:var(--success-soft)!important;border-color:var(--success)!important;color:#1a6e40}
.mc-btn.wrong{background:var(--danger-soft)!important;border-color:var(--danger)!important;color:#922b21}
.mc-btn:disabled{cursor:default}

/* ── SPELLING ── */
.spelling-area{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.spelling-input{padding:14px 16px;border-radius:12px;border:2px solid #dbb8f0;font-size:16px;font-family:inherit;background:white;color:var(--text);transition:border-color .15s;width:100%}
.spelling-input:focus{outline:none;border-color:var(--accent)}
.spelling-row{display:grid;grid-template-columns:1fr auto;gap:10px}

/* ── LISTENING ── */
.listening-box{padding:20px;background:#ecf0f1;border-radius:14px;text-align:center;margin-bottom:14px}
.listening-prompt{font-size:28px;margin-bottom:8px}
.listening-note{font-size:13px;color:var(--muted);margin-top:8px}
.play-btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:white;border:none;border-radius:30px;padding:12px 24px;font-size:15px;font-weight:bold;cursor:pointer;font-family:inherit;transition:background .15s}
.play-btn:active{transform:scale(0.95)}
.play-btn:hover{background:var(--accent-dark)}

/* ── BUTTONS ── */
.btn{padding:12px 18px;border-radius:12px;font-size:15px;border:none;cursor:pointer;display:flex;align-items:center;gap:8px;justify-content:center;min-height:44px;font-weight:bold;font-family:inherit;transition:all .15s}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--accent);color:white}
.btn-primary:hover{background:var(--accent-dark)}
.btn-primary:active{transform:scale(0.96)}
.btn-primary:disabled{background:#c8a8e8;cursor:not-allowed}
.btn-success{background:var(--success);color:white}
.btn-success:hover{background:#219a52}
.btn-success:active{transform:scale(0.96)}
.btn-danger{background:#ecf0f1;color:#c0392b;border:2px solid #fca5a5}
.btn-danger:hover{background:var(--danger-soft)}
.btn-danger:active{transform:scale(0.96)}
.btn-secondary{background:#ecf0f1;color:var(--text)}
.btn-secondary:hover{background:#dfe6e9}
.btn-full{width:100%}

/* ── FEEDBACK ── */
.feedback{padding:14px 16px;border-radius:12px;font-size:15px;font-weight:bold;margin-bottom:12px;display:flex;align-items:flex-start;gap:10px;line-height:1.4}
.feedback-ok{background:var(--success-soft);border:2px solid #86efac;color:#1a6e40}
.feedback-bad{background:var(--danger-soft);border:2px solid #fca5a5;color:#922b21}
.feedback-icon{font-size:20px;flex-shrink:0;margin-top:1px}
.correct-answer{font-size:13px;font-weight:normal;margin-top:4px;color:#555}

/* ── BONUS ── */
.bonus-box{margin-top:4px;margin-bottom:12px;background:linear-gradient(135deg,#fff9e6,#fef3cd);border:2px solid #f1c40f;border-radius:14px;padding:14px;text-align:center;animation:bonusPop .35s ease}
@keyframes bonusPop{from{transform:scale(0.85);opacity:0}to{transform:scale(1);opacity:1}}
.bonus-coins{font-size:22px;font-weight:bold;color:#7d5a00;margin-top:4px}

/* ── DIVIDER ── */
.divider{height:1px;background:#ede0f7;margin:12px 0}
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <a href="../index.html" class="back-home" title="Zurück zur Startseite">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    </a>
    <img src="../images/icon_eng.png" class="app-icon" alt="Englisch" onerror="this.style.display='none'">
    <div class="header-text">
      <h1>🇬🇧 Englisch-Trainer</h1>
      <p>3. Klasse Bayern · Vokabeln entdecken & üben</p>
    </div>
  </div>

  <!-- PROFILE + COIN BAR -->
  <div class="profile-bar">
    <div class="child-badge">
      <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span id="profileName">–</span>
    </div>
    <div class="coin-badge">🪙 <span id="coinCount">0</span></div>
  </div>

  <!-- SCORE BAR -->
  <div class="score-bar">
    <strong>
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      Punkte heute
    </strong>
    <div class="score-chips">
      <span class="score-chip chip-ok" id="scoreOk">✓ 0 richtig</span>
      <span class="score-chip chip-bad" id="scoreWrong">✗ 0 falsch</span>
    </div>
  </div>

  <!-- MAIN LAYOUT -->
  <div class="main-layout">

    <!-- LEFT: TOPIC TILES -->
    <div class="card">
      <div class="panel-title">📚 Themen</div>
      <div class="tile-grid" id="tileGrid"></div>
    </div>

    <!-- RIGHT: EXERCISE PANEL -->
    <div class="card" id="exercisePanel">

      <!-- DEFAULT VIEW -->
      <div id="viewDefault" class="view-container active">
        <div class="default-hint">
          <div class="default-icon">🇬🇧</div>
          <p><b>Wähle links ein Thema aus</b><br>und starte mit Vokabeln entdecken, üben oder Quiz.</p>
        </div>
      </div>

      <!-- TOPIC VIEW -->
      <div id="viewTopic" class="view-container">

        <!-- Topic Header -->
        <div class="topic-header">
          <div class="topic-header-icon" id="topicIcon"></div>
          <div>
            <div class="topic-header-title" id="topicTitle"></div>
            <div class="topic-header-en" id="topicTitleEn"></div>
          </div>
          <div class="word-count-badge" id="wordCountBadge"></div>
        </div>

        <!-- Discover Toggle -->
        <button class="discover-toggle" id="discoverToggle" onclick="toggleWordGrid()">
          <span id="discoverToggleIcon">▼</span> Alle Vokabeln entdecken
        </button>

        <!-- Word Grid (hidden by default) -->
        <div id="wordGrid" class="word-grid hidden"></div>

        <div class="divider"></div>

        <!-- MODE TABS -->
        <div class="mode-tabs">
          <button class="mode-tab active" id="tab-flashcard" onclick="setMode('flashcard')">🃏 Wortkarten</button>
          <button class="mode-tab" id="tab-mc" onclick="setMode('mc')">✅ Auswählen</button>
          <button class="mode-tab" id="tab-spelling" onclick="setMode('spelling')">✏️ Schreiben</button>
          <button class="mode-tab" id="tab-listening" onclick="setMode('listening')">🔊 Hören</button>
        </div>

        <!-- ── FLASHCARD MODE ── -->
        <div id="modeFlashcard" class="mode-area">
          <div id="flashcard" class="flashcard front-visible" onclick="flipCard()">
            <div class="fc-label" id="fcLabel">Deutsch 🇩🇪</div>
            <div class="fc-word" id="fcWord"></div>
            <div id="fcExtra"></div>
          </div>
          <div class="fc-actions">
            <button class="btn btn-danger" onclick="markFlashcard(false)">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
              Noch üben
            </button>
            <button class="btn btn-success" onclick="markFlashcard(true)">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
              Gewusst!
            </button>
          </div>
        </div>

        <!-- ── MULTIPLE CHOICE MODE ── -->
        <div id="modeMC" class="mode-area hidden">
          <div class="task-box">
            <div class="question-row">
              <button class="speaker-btn" onclick="speakCurrent()" title="Wort anhören">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
              </button>
              <div class="task-question" id="mcQuestion"></div>
            </div>
            <div class="task-hint" id="mcHint"></div>
          </div>
          <div class="mc-grid" id="mcGrid"></div>
        </div>

        <!-- ── SPELLING MODE ── -->
        <div id="modeSpelling" class="mode-area hidden">
          <div class="task-box">
            <div class="task-question" id="spellingQuestion"></div>
            <div class="task-hint" id="spellingHint"></div>
          </div>
          <div class="spelling-area">
            <input type="text" id="spellingInput" class="spelling-input"
              placeholder="Englisches Wort eingeben …"
              autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
            <div class="spelling-row">
              <button class="btn btn-primary" onclick="checkSpelling()">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                Prüfen
              </button>
              <button class="btn btn-secondary" onclick="speakCurrent()" title="Wort anhören">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
                Vorhören
              </button>
            </div>
          </div>
        </div>

        <!-- ── LISTENING MODE ── -->
        <div id="modeListening" class="mode-area hidden">
          <div class="listening-box">
            <div class="listening-prompt">🔊</div>
            <button class="play-btn" id="listenPlayBtn" onclick="speakAndShowListening()">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              Wort abspielen
            </button>
            <div class="listening-note">Hör genau hin und wähle dann die richtige deutsche Bedeutung.</div>
          </div>
          <div class="mc-grid" id="listeningGrid"></div>
        </div>

        <!-- FEEDBACK AREA -->
        <div id="feedbackArea" class="hidden"></div>

        <!-- BONUS AREA -->
        <div id="bonusArea" class="hidden"></div>

        <!-- NEXT BUTTON -->
        <button id="nextBtn" class="btn btn-primary btn-full hidden" onclick="nextWord()">
          Nächstes Wort →
        </button>

      </div><!-- /viewTopic -->
    </div><!-- /exercise panel -->
  </div><!-- /main-layout -->
</div><!-- /app -->

<script src="englisch_woerter.js"></script>
<script>
'use strict';

/* ─── STORAGE ─── */
const STORAGE_KEY  = 'm_app_v9';
const ACTIVE_KEY   = 'm_app_active_prof';
const COINS_CORRECT = 2;

let activeProfId = null;
let currentTopic = null;
let currentWords  = [];
let currentWord   = null;
let currentMode   = 'flashcard';
let flashcardFront = true;
let answered      = false;
let sessionOk     = 0;
let sessionWrong  = 0;
let wordGridOpen  = false;

/* ─── PROFILE LOAD ─── */
function loadProfile() {
  try {
    activeProfId = localStorage.getItem(ACTIVE_KEY);
    const raw    = localStorage.getItem(STORAGE_KEY);
    if (!raw || !activeProfId) return;
    const profs = JSON.parse(raw);
    const p     = profs[activeProfId];
    if (!p) return;
    document.getElementById('profileName').textContent = p.name || '–';
    document.getElementById('coinCount').textContent   = p.coins || 0;
  } catch(e) {}
}

function refreshCoins() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const profs = JSON.parse(raw);
    document.getElementById('coinCount').textContent = profs[activeProfId]?.coins || 0;
  } catch(e) {}
}

function addCoins(n) {
  if (!activeProfId) return;
  try {
    const raw   = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const profs = JSON.parse(raw);
    if (!profs[activeProfId]) return;
    profs[activeProfId].coins = (profs[activeProfId].coins || 0) + n;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(profs));
    refreshCoins();
  } catch(e) {}
}

function saveHistory(topicKey, mode, ok) {
  if (!activeProfId) return;
  try {
    const raw   = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const profs = JSON.parse(raw);
    if (!profs[activeProfId]) return;
    if (!profs[activeProfId].eng_history) profs[activeProfId].eng_history = [];
    profs[activeProfId].eng_history.push({ ts: Date.now(), topic: topicKey, mode, ok });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(profs));
  } catch(e) {}
}

/* ─── TOPIC TILES ─── */
function renderTopicTiles() {
  const grid = document.getElementById('tileGrid');
  grid.innerHTML = '';
  Object.entries(ENG_TOPICS).forEach(([key, topic]) => {
    const div = document.createElement('div');
    div.className = 'tile';
    div.id = 'tile-' + key;
    div.innerHTML = `<div class="tile-icon">${topic.icon}</div>
      <div class="tile-text">
        <div class="tile-title">${topic.title_de}</div>
        <div class="tile-sub">${topic.title_en}</div>
      </div>`;
    div.addEventListener('click', () => selectTopic(key));
    grid.appendChild(div);
  });
}

/* ─── SELECT TOPIC ─── */
function selectTopic(key) {
  currentTopic  = key;
  currentWords  = ENG_TOPICS[key].words;
  sessionOk     = 0;
  sessionWrong  = 0;
  answered      = false;
  wordGridOpen  = false;

  // Update tile active state
  document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
  const activeTile = document.getElementById('tile-' + key);
  if (activeTile) activeTile.classList.add('active');

  // Update topic header
  const t = ENG_TOPICS[key];
  document.getElementById('topicIcon').textContent    = t.icon;
  document.getElementById('topicTitle').textContent   = t.title_de;
  document.getElementById('topicTitleEn').textContent = t.title_en;
  document.getElementById('wordCountBadge').textContent = currentWords.length + ' Vokabeln';

  // Reset word grid
  const wg = document.getElementById('wordGrid');
  wg.classList.add('hidden');
  document.getElementById('discoverToggleIcon').textContent = '▼';
  renderWordGrid();

  // Show topic view
  document.getElementById('viewDefault').classList.remove('active');
  document.getElementById('viewTopic').classList.add('active');

  // Reset mode to flashcard
  setMode('flashcard');
  updateScoreDisplay();
}

/* ─── WORD GRID (Entdecken) ─── */
function renderWordGrid() {
  const grid = document.getElementById('wordGrid');
  grid.innerHTML = '';
  currentWords.forEach(w => {
    const div = document.createElement('div');
    div.className = 'word-tile';
    div.innerHTML = `<div class="word-tile-en">${w.word_en}</div>
      <div class="word-tile-de">${w.word_de}</div>
      <div class="word-tile-speaker">🔊</div>`;
    div.addEventListener('click', () => speakText(w.word_en));
    grid.appendChild(div);
  });
}

function toggleWordGrid() {
  wordGridOpen = !wordGridOpen;
  const wg = document.getElementById('wordGrid');
  wg.classList.toggle('hidden', !wordGridOpen);
  document.getElementById('discoverToggleIcon').textContent = wordGridOpen ? '▲' : '▼';
}

/* ─── MODE SELECTION ─── */
function setMode(mode) {
  currentMode = mode;
  answered    = false;

  // Update tabs
  ['flashcard', 'mc', 'spelling', 'listening'].forEach(m => {
    document.getElementById('tab-' + m).classList.toggle('active', m === mode);
  });

  // Hide all mode areas + feedback + next btn
  document.querySelectorAll('.mode-area').forEach(el => el.classList.add('hidden'));
  document.getElementById('feedbackArea').classList.add('hidden');
  document.getElementById('bonusArea').classList.add('hidden');
  document.getElementById('nextBtn').classList.add('hidden');

  // Show selected mode
  const modeMap = { flashcard: 'modeFlashcard', mc: 'modeMC', spelling: 'modeSpelling', listening: 'modeListening' };
  document.getElementById(modeMap[mode]).classList.remove('hidden');

  nextWord();
}

/* ─── NEXT WORD ─── */
function nextWord() {
  if (!currentWords.length) return;
  answered = false;
  clearFeedback();

  // Avoid same word twice
  let pool = currentWords;
  if (currentWord && currentWords.length > 1) {
    pool = currentWords.filter(w => w.word_en !== currentWord.word_en);
  }
  currentWord = pool[Math.floor(Math.random() * pool.length)];

  document.getElementById('nextBtn').classList.add('hidden');
  document.getElementById('feedbackArea').classList.add('hidden');
  document.getElementById('bonusArea').classList.add('hidden');

  if (currentMode === 'flashcard')  renderFlashcard();
  if (currentMode === 'mc')         renderMC();
  if (currentMode === 'spelling')   renderSpelling();
  if (currentMode === 'listening')  renderListening();
}

/* ─── SPEECH ─── */
function speakText(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utt  = new SpeechSynthesisUtterance(text);
  utt.lang   = 'en-GB';
  utt.rate   = 0.85;
  utt.pitch  = 1.05;
  window.speechSynthesis.speak(utt);
}

function speakCurrent() {
  if (currentWord) speakText(currentWord.word_en);
}

/* ─── FLASHCARD ─── */
function renderFlashcard() {
  flashcardFront = true;
  const fc = document.getElementById('flashcard');
  fc.className = 'flashcard front-visible';
  document.getElementById('fcLabel').textContent = 'Deutsch 🇩🇪';
  document.getElementById('fcWord').textContent  = currentWord.word_de;
  const extra = document.getElementById('fcExtra');
  extra.innerHTML = '<div class="fc-tip">Tippe auf die Karte → Englisch sehen</div>';
}

function flipCard() {
  if (currentMode !== 'flashcard' || !currentWord) return;
  flashcardFront = !flashcardFront;
  const fc = document.getElementById('flashcard');
  if (!flashcardFront) {
    fc.className = 'flashcard back-visible';
    document.getElementById('fcLabel').textContent = 'Englisch 🇬🇧';
    document.getElementById('fcWord').textContent  = currentWord.word_en;
    const extra = document.getElementById('fcExtra');
    extra.innerHTML = `<div class="fc-example">${currentWord.example}</div>
      <button class="fc-speak-btn" onclick="event.stopPropagation();speakCurrent()">🔊 Anhören</button>`;
    speakCurrent();
  } else {
    renderFlashcard();
  }
}

function markFlashcard(knew) {
  if (!currentWord) return;
  saveHistory(currentTopic, 'flashcard', knew);
  if (knew) {
    sessionOk++;
    addCoins(COINS_CORRECT);
    showFeedback(true, null);
  } else {
    sessionWrong++;
    showFeedback(false, currentWord.word_en);
  }
  updateScoreDisplay();
  setTimeout(() => nextWord(), 900);
}

/* ─── MULTIPLE CHOICE ─── */
function getDistractors(answerKey, correctValue, n) {
  const all = Object.values(ENG_TOPICS).flatMap(t => t.words);
  const pool = all.filter(w => w[answerKey] !== correctValue);
  const shuffled = pool.sort(() => Math.random() - 0.5);
  return [...new Set(shuffled.map(w => w[answerKey]))].slice(0, n);
}

function buildChoices(answerKey, correctValue) {
  const wrong   = getDistractors(answerKey, correctValue, 3);
  const choices = [correctValue, ...wrong].sort(() => Math.random() - 0.5);
  return choices;
}

function renderMC() {
  document.getElementById('mcQuestion').textContent = `Wie heißt „${currentWord.word_de}" auf Englisch?`;
  document.getElementById('mcHint').textContent     = `Thema: ${ENG_TOPICS[currentTopic].title_en}`;

  const grid    = document.getElementById('mcGrid');
  const choices = buildChoices('word_en', currentWord.word_en);
  grid.innerHTML = '';
  choices.forEach(choice => {
    const btn = document.createElement('button');
    btn.className   = 'mc-btn';
    btn.textContent = choice;
    btn.addEventListener('click', () => checkMC(btn, choice));
    grid.appendChild(btn);
  });
}

function checkMC(btn, choice) {
  if (answered) return;
  answered = true;
  const correct = choice === currentWord.word_en;
  document.querySelectorAll('#mcGrid .mc-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === currentWord.word_en) b.classList.add('correct');
  });
  if (!correct) btn.classList.add('wrong');
  registerAnswer(correct, 'mc');
}

/* ─── SPELLING ─── */
function renderSpelling() {
  document.getElementById('spellingQuestion').textContent =
    `Schreibe das englische Wort für „${currentWord.word_de}".`;
  document.getElementById('spellingHint').textContent =
    `Beispiel: ${currentWord.example}`;
  const inp = document.getElementById('spellingInput');
  inp.value    = '';
  inp.disabled = false;
  inp.focus();
}

function checkSpelling() {
  if (answered) return;
  const inp    = document.getElementById('spellingInput');
  const answer = inp.value.trim().toLowerCase();
  if (!answer) { inp.focus(); return; }
  answered     = true;
  inp.disabled = true;
  const correct = answer === currentWord.word_en.toLowerCase();
  registerAnswer(correct, 'spelling');
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('spellingInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkSpelling();
  });
});

/* ─── LISTENING ─── */
function renderListening() {
  const grid    = document.getElementById('listeningGrid');
  const choices = buildChoices('word_de', currentWord.word_de);
  grid.innerHTML = '';
  choices.forEach(choice => {
    const btn = document.createElement('button');
    btn.className   = 'mc-btn';
    btn.textContent = choice;
    btn.addEventListener('click', () => checkListening(btn, choice));
    grid.appendChild(btn);
  });
  // Auto-play after short delay
  setTimeout(() => speakCurrent(), 400);
}

function speakAndShowListening() {
  speakCurrent();
}

function checkListening(btn, choice) {
  if (answered) return;
  answered = true;
  const correct = choice === currentWord.word_de;
  document.querySelectorAll('#listeningGrid .mc-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === currentWord.word_de) b.classList.add('correct');
  });
  if (!correct) btn.classList.add('wrong');
  registerAnswer(correct, 'listening');
}

/* ─── REGISTER ANSWER (MC / Spelling / Listening) ─── */
function registerAnswer(correct, mode) {
  saveHistory(currentTopic, mode, correct);
  if (correct) {
    sessionOk++;
    addCoins(COINS_CORRECT);
    showFeedback(true, null);
    showBonus();
  } else {
    sessionWrong++;
    showFeedback(false, currentWord.word_en);
  }
  updateScoreDisplay();
  document.getElementById('nextBtn').classList.remove('hidden');
}

/* ─── FEEDBACK ─── */
const FEEDBACK_OK = [
  'Super! Das war richtig!',
  'Toll! Weiter so!',
  'Richtig! Du lernst das ganz schnell!',
  'Klasse! Das hast du dir gemerkt!',
  'Prima! Immer besser!'
];
const FEEDBACK_BAD = [
  'Fast! Schau dir das Wort nochmal an.',
  'Nicht ganz – übe dieses Wort noch einmal.',
  'Noch nicht richtig – kein Problem, weiter üben!',
  'Du schaffst das! Probiere es nochmal.'
];

function showFeedback(ok, correctAnswer) {
  const area = document.getElementById('feedbackArea');
  const msg  = ok
    ? FEEDBACK_OK[Math.floor(Math.random() * FEEDBACK_OK.length)]
    : FEEDBACK_BAD[Math.floor(Math.random() * FEEDBACK_BAD.length)];
  area.className = ok ? 'feedback feedback-ok' : 'feedback feedback-bad';
  area.innerHTML = `<div class="feedback-icon">${ok ? '✅' : '❌'}</div>
    <div>
      ${msg}
      ${!ok && correctAnswer ? `<div class="correct-answer">Die richtige Antwort: <b>${correctAnswer}</b></div>` : ''}
    </div>`;
  area.classList.remove('hidden');
}

function showBonus() {
  const area = document.getElementById('bonusArea');
  area.innerHTML = `<div class="bonus-box">
    <div>🎉 Richtig!</div>
    <div class="bonus-coins">+${COINS_CORRECT} 🪙</div>
  </div>`;
  area.classList.remove('hidden');
}

function clearFeedback() {
  document.getElementById('feedbackArea').classList.add('hidden');
  document.getElementById('bonusArea').classList.add('hidden');
}

/* ─── SCORE DISPLAY ─── */
function updateScoreDisplay() {
  document.getElementById('scoreOk').textContent    = `✓ ${sessionOk} richtig`;
  document.getElementById('scoreWrong').textContent = `✗ ${sessionWrong} falsch`;
}

/* ─── INIT ─── */
loadProfile();
renderTopicTiles();
</script>
