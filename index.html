<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Mathe-Trainer 3. Klasse Bayern</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<link rel="icon" type="image/png" href="main.png">
<link rel="apple-touch-icon" href="main.png">
<style>
:root {
  --bg: #e9f4ff; --card: #ffffff; --accent: #3498db; --accent-soft: #d6ecff;
  --danger: #e74c3c; --success: #27ae60; --text: #222222; --muted: #666666;
  --radius: 18px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; display: flex; justify-content: center;
}
.app{ width:100%; max-width:1100px; padding:12px; }
.card{
  background:var(--card); border-radius:var(--radius);
  box-shadow:0 8px 24px rgba(0,0,0,0.08); padding:16px;
}
.header{ display:flex; align-items:center; gap:16px; margin-bottom:14px; position: relative;}

.back-home{
  background: #ecf0f1; border: none; border-radius: 12px; padding: 10px 12px;
  cursor: pointer; color: var(--text); display: flex; align-items: center; justify-content: center; transition: background 0.2s; text-decoration: none;
}
.back-home svg { width: 24px; height: 24px; }
.back-home:hover{ background: #bdc3c7; }

.app-icon{ width:64px; height:64px; border-radius:16px; object-fit:cover; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
.header-text h1{ font-size:22px; margin-bottom:4px; color:#2c3e50; }
.header-text p{ font-size:14px; color:var(--muted); }
.profile-bar, .score-bar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px; }
.score-bar{ padding:10px 14px; border-radius:16px; background:var(--accent-soft); font-size:14px; }
.score-bar strong{ font-size:16px; color:#1b6fab; display:flex; align-items:center; gap:6px;}
.score-icon { width: 20px; height: 20px; color: #1b6fab;}

.stars{ color:#f39c12; display:flex; gap: 2px; }
.star-icon { width: 22px; height: 22px; fill: currentColor; }
.star-empty { fill: none; stroke: currentColor; stroke-width: 2;}

select, .btn{ padding:8px 14px; border-radius:12px; font-size:14px; border:none; cursor:pointer; display:flex; align-items:center; gap:6px; justify-content:center;}
select{ border:1px solid #ccd8e6; background:#f8fbff; font-weight:bold;}
.btn-primary{ background:var(--accent); color:white; font-weight:bold; }
.btn-secondary{ background:#ecf0f1; color:var(--text); }
.btn-danger{ background:#ffe4e1; color:#c0392b; }
.btn:active{ transform:scale(0.96); }
.btn svg { width: 18px; height: 18px; }

.main-layout{ display:grid; grid-template-columns: 1fr 1.2fr; gap:16px; }
@media(max-width:800px){ .main-layout{ grid-template-columns:1fr; } }

.tile-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:10px; }
.tile{
  background:#f7fbff; border-radius:12px; padding:12px; border:2px solid #d9e8f7;
  cursor:pointer; transition:all .2s; min-height:85px; display:flex; flex-direction:column; justify-content: center;
}
.tile:hover, .tile.active{ border-color:var(--accent); background:#edf5fc; transform:translateY(-2px); }
.tile-title{ font-size:14px; font-weight:bold; margin-bottom:2px; color:#2c3e50; }
.tile-sub{ font-size:10px; color:var(--muted); }

.panel-title{ font-size:18px; font-weight:bold; margin-bottom:8px; color:#2c3e50; display:flex; align-items:center; gap:8px;}
.panel-icon { width: 22px; height: 22px; color: #3498db; }

.task-box{
  margin-top:12px; padding:20px; border-radius:16px; background:#fdfdfd;
  border:2px solid #e1e8f0; text-align:center; box-shadow:inset 0 2px 10px rgba(0,0,0,0.02);
}
.task-question{ font-size:22px; font-weight:bold; margin-bottom:10px; color:#2c3e50; line-height:1.3;}
.visual-container{ margin:15px 0; display:flex; flex-direction: column; align-items:center; }
.task-hint{ font-size:13px; color:var(--muted); margin-bottom:15px; display:flex; justify-content:center; align-items:center; gap:6px;}

/* MAUER */
.mauer-wrapper{ display:flex; flex-direction:column; align-items:center; gap:4px; margin: 10px 0;}
.mauer-row{ display:flex; justify-content:center; gap:8px; }
.brick{ width:75px; height:45px; background:#e67e22; border-radius:6px; border:2px solid #d35400; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:bold; color:white; box-shadow:0 3px 0 #b33c00; }
.brick input{ width:100%; height:100%; border:none; background:white; border-radius:4px; text-align:center; font-size:20px; font-weight:bold; color:#d35400; }
.brick input:focus{ outline:none; box-shadow:inset 0 0 0 3px #f1c40f; }

/* TAUSENDERBUCH */
.tausender-cross{ display:grid; grid-template-columns: 60px 60px 60px; gap:6px; justify-content:center; }
.t-cell{ width:60px; height:60px; border-radius:8px; }
.t-center{ background:#3498db; color:white; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:bold; box-shadow:0 4px 0 #2980b9;}
.t-input{ width:100%; height:100%; text-align:center; font-size:20px; font-weight:bold; border:2px solid #bdc3c7; border-radius:8px; background:#fff; }
.t-input:focus{ border-color:#3498db; outline:none; }

.std-input{ width:110px; padding:10px; font-size:24px; font-weight:bold; text-align:center; border:3px solid #ccd8e6; border-radius:12px; margin:0 5px; }
.std-input:focus{ border-color:#3498db; outline:none; }

.feedback{ margin-top:15px; font-size:16px; font-weight:bold; min-height:24px; display:flex; justify-content:center; align-items:center; gap:8px;}
.feedback.ok{ color:var(--success); }
.feedback.bad{ color:var(--danger); }
.fb-icon { width: 24px; height: 24px; }

.stats-card{ background:#fdfdfd; border-radius:16px; padding:12px; border:2px solid #e1e8f0; margin-top:10px;}
.stats-row{ display:flex; align-items:center; font-size:12px; margin-bottom:6px; }
.stats-bar{ flex:1; height:8px; background:#ecf0f1; border-radius:10px; margin:0 10px; overflow:hidden; }
.stats-fill{ height:100%; background:var(--success); transition:width 0.5s; }
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <div class="header">
      <a href="index.html" class="back-home" title="Zurück zur Startseite">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      </a>
      <img src="main.png" class="app-icon" alt="Icon" onerror="this.style.display='none'">
      <div class="header-text">
        <h1>Mathe-Trainer 3. Klasse</h1>
        <p>LehrplanPLUS Bayern · Endlos viele Aufgaben</p>
      </div>
    </div>

    <!-- Profil & Stats -->
    <div class="profile-bar">
      <div>
        <select id="profileSelect"></select>
      </div>
      <div style="display:flex; gap:6px;">
        <button class="btn btn-secondary" id="addBtn">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
          Neues Kind
        </button>
        <button class="btn btn-danger" id="delBtn">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          Löschen
        </button>
      </div>
    </div>

    <div class="score-bar">
      <div>
        <strong>
          <svg class="score-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
          <span id="scoreText">Punkte: 0</span>
        </strong>
      </div>
      <div class="stars" id="starsText"></div>
    </div>

    <div class="main-layout">
      <!-- Links: Menü -->
      <div>
        <div class="panel-title">
          <svg class="panel-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
          Themengebiete
        </div>
        <div class="tile-grid" id="taskTiles"></div>
      </div>

      <!-- Rechts: Aufgabe -->
      <div>
        <div class="panel-title" id="taskTitle">
          <svg class="panel-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
          Aktuelle Aufgabe
        </div>
        <div class="task-box">
          <div class="task-question" id="tQuestion">Wähle links ein Thema!</div>
          <div class="visual-container" id="tVisual"></div>
          <div class="task-hint" id="tHint"></div>
          
          <div style="margin-top:15px; display:flex; justify-content:center;">
            <button class="btn btn-primary" id="checkBtn" style="padding:12px 24px; font-size:16px;" disabled>
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
              Antwort prüfen
            </button>
            <button class="btn btn-secondary" id="nextBtn" style="padding:12px 24px; font-size:16px; display:none;">
              Nächste Aufgabe
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
          </div>
          <div class="feedback" id="feedback"></div>
        </div>

        <div class="stats-card">
          <div style="font-weight:bold; margin-bottom:8px; color:#2c3e50; display:flex; align-items:center; gap:6px;">
            <svg style="width:18px;height:18px;color:#3498db;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
            Profil-Statistik
          </div>
          <div id="statsList" style="column-count: 2; column-gap: 20px;"></div>
          <button class="btn btn-secondary" id="resetBtn" style="margin-top:10px; width:100%; font-size:12px;">Statistik leeren</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function speak(text){
  try{
    if('speechSynthesis' in window){
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'de-DE'; u.rate = 1.0; window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}

function drawClock(h, m) {
  const hA = ((h % 12) + m/60) * 30 - 90, mA = m * 6 - 90;
  const hx = 50 + 20 * Math.cos(hA*Math.PI/180), hy = 50 + 20 * Math.sin(hA*Math.PI/180);
  const mx = 50 + 32 * Math.cos(mA*Math.PI/180), my = 50 + 32 * Math.sin(mA*Math.PI/180);
  let ticks = '';
  for(let i=0; i<12; i++){
    const a = (i*30-90)*Math.PI/180;
    ticks += `<line x1="${50+40*Math.cos(a)}" y1="${50+40*Math.sin(a)}" x2="${50+45*Math.cos(a)}" y2="${50+45*Math.sin(a)}" stroke="#34495e" stroke-width="${i%3===0?3:1}"/>`;
  }
  return `<svg width="120" height="120" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="white" stroke="#bdc3c7" stroke-width="4"/>${ticks}<line x1="50" y1="50" x2="${hx}" y2="${hy}" stroke="#2c3e50" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="50" x2="${mx}" y2="${my}" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="50" r="3" fill="#2c3e50"/></svg>`;
}

function drawShape(type) {
  let paths = '';
  if (type === 'cube') paths = `<path d="M50 15 L85 30 L85 75 L50 90 L15 75 L15 30 Z" fill="#3498db" stroke="#1b6fab" stroke-width="2"/><path d="M50 15 L15 30 L50 45 L85 30 Z" fill="#85c1e9" stroke="#1b6fab" stroke-width="2"/><path d="M50 45 L50 90" stroke="#1b6fab" stroke-width="2"/>`;
  else if (type === 'cylinder') paths = `<path d="M25 30 L25 75 A 25 10 0 0 0 75 75 L75 30 Z" fill="#3498db" stroke="#1b6fab" stroke-width="2"/><ellipse cx="50" cy="30" rx="25" ry="10" fill="#85c1e9" stroke="#1b6fab" stroke-width="2"/><ellipse cx="50" cy="75" rx="25" ry="10" fill="none" stroke="#1b6fab" stroke-width="2" stroke-dasharray="4,4"/>`;
  else if (type === 'rect') paths = `<rect x="20" y="30" width="60" height="40" fill="#3498db" stroke="#1b6fab" stroke-width="2"/>`;
  else if (type === 'sym') paths = `<path d="M50 10 C30 10 10 30 50 50 C10 70 30 90 50 90 C70 90 90 70 50 50 C90 30 70 10 50 10 Z" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/> <line x1="50" y1="5" x2="50" y2="95" stroke="#e74c3c" stroke-width="3" stroke-dasharray="5,5"/>`;
  return `<svg width="120" height="120" viewBox="0 0 100 100">${paths}</svg>`;
}

function drawNumberLine(num, isHundred) {
  const step = isHundred ? 100 : 10;
  const lower = Math.floor(num/step)*step, upper = lower + step;
  const percent = ((num - lower) / step) * 100;
  return `<svg width="280" height="60" viewBox="0 0 280 60"><line x1="20" y1="30" x2="260" y2="30" stroke="#7f8c8d" stroke-width="4"/><line x1="20" y1="20" x2="20" y2="40" stroke="#2c3e50" stroke-width="4"/><line x1="260" y1="20" x2="260" y2="40" stroke="#2c3e50" stroke-width="4"/><text x="20" y="55" font-size="16" font-family="Arial" font-weight="bold" text-anchor="middle" fill="#2c3e50">${lower}</text><text x="260" y="55" font-size="16" font-family="Arial" font-weight="bold" text-anchor="middle" fill="#2c3e50">${upper}</text><circle cx="${20 + (percent*2.4)}" cy="30" r="8" fill="#e74c3c"/><text x="${20 + (percent*2.4)}" y="15" font-size="16" font-family="Arial" font-weight="bold" text-anchor="middle" fill="#e74c3c">${num}</text></svg>`;
}

const tasks = {
  rechnen_gross: {
    title: "Schriftliches Rechnen", sub: "+ - × bis 1000",
    gen() {
      const op = ['+','-','*'][randInt(0,2)]; let a,b,s;
      if(op==='+'){ a=randInt(150,500); b=randInt(150,400); s=a+b; }
      else if(op==='-'){ a=randInt(400,900); b=randInt(110,a-50); s=a-b; }
      else { a=randInt(12,30); b=randInt(3,9); s=a*b; }
      return { q: `${a} ${op==='*'?'×':op} ${b} = ?`, hint: "Rechne halbschriftlich oder im Kopf.", html: `<input type="number" class="std-input" id="inp_1">`, ids: ['inp_1'], sol: [s], isFloat: false };
    }
  },
  div_rest: {
    title: "Division mit Rest", sub: "z.B. 25 : 4",
    gen() {
      let a = randInt(15, 89),
