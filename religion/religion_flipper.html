<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Bibelflipper – Jakob & Esau</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<style>
:root{--accent:#e67e22;--accent-dark:#c0652d;--bg:#0d1b3e;--text:#fff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:none}
body{background:var(--bg);color:var(--text);font-family:Segoe UI,Roboto,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow:hidden}
.topbar{width:100%;max-width:420px;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;flex-shrink:0}
.back-btn{background:rgba(255,255,255,.12);border:none;border-radius:10px;padding:8px 10px;cursor:pointer;color:#fff;display:flex;align-items:center;text-decoration:none}
.back-btn svg{width:20px;height:20px;stroke:currentColor;fill:none}
.hud{display:flex;gap:14px;align-items:center;font-size:14px;font-weight:bold}
.hud-item{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.1);padding:6px 12px;border-radius:10px}

#canvas{display:block;max-width:420px;width:100%;cursor:none}

/* Factoid popup */
.factoid{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(255,255,255,.95);color:#2c3e50;border-radius:16px;padding:12px 18px;font-size:14px;font-weight:bold;max-width:340px;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.35);pointer-events:none;opacity:0;transition:opacity .3s;z-index:10;line-height:1.5}
.factoid.show{opacity:1}

/* Overlay screens */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(13,27,62,.92);z-index:20;padding:24px;text-align:center}
.screen h2{font-size:26px;font-weight:bold}
.screen p{font-size:15px;color:rgba(255,255,255,.75);max-width:300px;line-height:1.6}
.btn-big{background:linear-gradient(135deg,var(--accent),#f39c12);color:#fff;border:none;border-radius:16px;padding:14px 36px;font-size:16px;font-weight:bold;cursor:pointer;box-shadow:0 4px 16px rgba(230,126,34,.5)}
.btn-sec{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:14px;padding:12px 24px;font-size:14px;font-weight:bold;cursor:pointer}
.score-big{font-size:52px;font-weight:bold;color:var(--accent)}
.lives-row{display:flex;gap:8px;font-size:22px}

/* Touch controls */
.touch-controls{width:100%;max-width:420px;display:flex;justify-content:space-between;padding:8px 12px;flex-shrink:0}
.touch-btn{flex:1;max-width:140px;padding:16px 0;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);border-radius:16px;color:#fff;font-size:15px;font-weight:bold;cursor:pointer;user-select:none;-webkit-user-select:none;active-background:rgba(255,255,255,.2)}
.touch-btn:active{background:rgba(230,126,34,.5);border-color:var(--accent)}
</style>
</head>
<body>

<div class="topbar">
  <a href="religion_trainer.html" class="back-btn">
    <svg viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
  </a>
  <div class="hud">
    <div class="hud-item">⭐ <span id="scoreEl">0</span></div>
    <div class="hud-item" id="livesEl">❤️❤️❤️</div>
  </div>
</div>

<canvas id="canvas"></canvas>

<div class="touch-controls">
  <button class="touch-btn" id="btnLeft" ontouchstart="leftDown()" ontouchend="leftUp()" onmousedown="leftDown()" onmouseup="leftUp()">◀ Links</button>
  <button class="touch-btn" id="btnRight" ontouchstart="rightDown()" ontouchend="rightUp()" onmousedown="rightDown()" onmouseup="rightUp()">Rechts ▶</button>
</div>

<div class="factoid" id="factoid"></div>

<!-- START SCREEN -->
<div class="screen" id="startScreen">
  <div style="font-size:56px">⚡</div>
  <h2>Bibelflipper</h2>
  <p>Treffe die heiligen Bumper und lerne Fakten über Jakob & Esau!</p>
  <div style="font-size:13px;color:rgba(255,255,255,.5)">← → Tasten oder Buttons unten</div>
  <div id="startCoinInfo" style="font-size:14px;color:#f39c12;font-weight:bold;background:rgba(255,255,255,.1);padding:8px 16px;border-radius:10px">🪙 Kosten: 10 Münzen · Dein Guthaben: <span id="startCoinCount">?</span> 🪙</div>
  <button class="btn-big" onclick="startGame(true)">Spielen! ▶</button>
  <a href="religion_trainer.html" class="btn-sec">Zurück</a>
</div>

<!-- GAME OVER SCREEN -->
<div class="screen" id="gameOverScreen" style="display:none">
  <div style="font-size:56px">😢</div>
  <h2>Game Over</h2>
  <div class="score-big" id="goScore">0</div>
  <p id="goRounds">Nicht schlecht – aber Jakob hätte weitergemacht!</p>
  <div id="goHsRow" style="font-size:13px;color:rgba(255,255,255,.6);background:rgba(255,255,255,.08);padding:8px 16px;border-radius:10px;display:none">🏆 Dein Rekord: <strong id="goHsBest">0</strong> Punkte</div>
  <button class="btn-big" onclick="startGame(false)">Nochmal 🔁</button>
  <a href="religion_trainer.html" class="btn-sec">Zum Trainer</a>
</div>

<!-- ROUND COMPLETE BANNER (shown briefly, not blocking) -->
<div id="roundBanner" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,#f1c40f,#e67e22);color:#2c3e50;border-radius:20px;padding:18px 32px;font-size:22px;font-weight:bold;text-align:center;z-index:15;box-shadow:0 8px 28px rgba(0,0,0,.5);pointer-events:none">
  🎉 Runde <span id="roundNum">1</span> komplett! +5 🪙
</div>

<script>
// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const STORAGE_KEY = 'm_app_v9', ACTIVE_KEY = 'm_app_active_prof';

const BUMPERS = [
  { label:'🍲', name:'Linsengericht', color:'#e74c3c',
    fact:'Esau verkaufte sein Erstgeburtsrecht für ein Linsengericht!' },
  { label:'🪜', name:'Himmelsleiter', color:'#9b59b6',
    fact:'Jakob träumte von einer Leiter bis in den Himmel – Engel stiegen auf und nieder.' },
  { label:'🧔', name:'Esau', color:'#e67e22',
    fact:'Esau war stark behaart und liebte die Jagd. Er war der Erstgeborene.' },
  { label:'🐑', name:'Jakob', color:'#27ae60',
    fact:'Jakob hütete Schafe und war das Mama-Kind. Er hielt Esaus Ferse bei der Geburt.' },
  { label:'🙏', name:'Segen', color:'#3498db',
    fact:'Der Segen des Vaters konnte nicht zurückgenommen werden – er gehörte für immer Jakob.' },
];

// ─── STORAGE ─────────────────────────────────────────────────────────────────
function getProfile() {
  try {
    const profiles = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
    const id = localStorage.getItem(ACTIVE_KEY);
    return (id && profiles[id]) ? profiles[id] : null;
  } catch(e) { return null; }
}
function addCoins(n) {
  try {
    const profiles = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
    const id = localStorage.getItem(ACTIVE_KEY);
    if (id && profiles[id]) {
      profiles[id].coins = (profiles[id].coins||0) + n;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(profiles));
    }
  } catch(e) {}
}

function saveFlipperHighscore(finalScore) {
  try {
    const profile = getProfile();
    const name = profile ? profile.name : 'Unbekannt';
    let hs = JSON.parse(localStorage.getItem('m_rel_flipper_hs') || '[]');
    hs.push({ name, score: finalScore });
    hs.sort((a, b) => b.score - a.score);
    hs = hs.slice(0, 10);
    localStorage.setItem('m_rel_flipper_hs', JSON.stringify(hs));
    // Show best score on game-over screen
    const best = hs[0] ? hs[0].score : finalScore;
    const hsRow = document.getElementById('goHsRow');
    if (hsRow) {
      document.getElementById('goHsBest').textContent = best;
      hsRow.style.display = 'block';
    }
  } catch(e) {}
}

// ─── GAME STATE ──────────────────────────────────────────────────────────────
let W, H, scale;
let ball = {}, leftFlipper = {}, rightFlipper = {};
let bumpers = [];
let lDown = false, rDown = false;
let score = 0, lives = 3, running = false, ballLost = false, round = 0;
let factoidTimer = null;
let animId = null;
let countdownText = '';   // '' means no countdown overlay
let guideWalls = [];      // [{ax,ay,bx,by}, ...]

const FLIPPER_LEN = 70;
const FLIPPER_THICK = 10;
const BALL_R = 10;
const BUMPER_R = 28;

function resize() {
  const maxW = Math.min(window.innerWidth, 420);
  const maxH = window.innerHeight - 140;
  canvas.width = maxW;
  canvas.height = Math.min(maxH, 680);
  W = canvas.width; H = canvas.height;
  initPositions();
}

function initPositions() {
  // Flippers
  const fy = H - 60;
  leftFlipper  = { x: W*0.28, y: fy, angle: 0.5, target: 0.5, angularVel: 0 };
  rightFlipper = { x: W*0.72, y: fy, angle: Math.PI - 0.5, target: Math.PI - 0.5, angularVel: 0 };

  // Guide walls: from bottom-corner area up to flipper pivot
  guideWalls = [
    { ax: 0,  ay: H - 100, bx: leftFlipper.x,  by: leftFlipper.y },
    { ax: W,  ay: H - 100, bx: rightFlipper.x, by: rightFlipper.y },
  ];

  // Bumpers arranged in a pattern – move lower so ball can reach them
  const bx = W/2, by = H*0.38;
  bumpers = BUMPERS.map((b, i) => {
    const angle = (i / BUMPERS.length) * Math.PI * 2 - Math.PI/2;
    const r = W * 0.24;
    return {
      ...b,
      x: bx + Math.cos(angle)*r,
      y: by + Math.sin(angle)*r,
      hit: false,
      hitAnim: 0,
    };
  });
}

function resetBall() {
  ball = {
    x: W*0.5 + (Math.random()-0.5)*20,
    y: H*0.5,
    vx: (Math.random()-0.5)*2,
    vy: -4,
  };
}

function updateStartScreen() {
  const profile = getProfile();
  const coins = profile ? (profile.coins || 0) : 0;
  document.getElementById('startCoinCount').textContent = coins;
}

function startGame(fromStart) {
  // Deduct 10 coins only when starting fresh from the start screen
  if (fromStart) {
    const profile = getProfile();
    const coins = profile ? (profile.coins || 0) : 0;
    if (coins < 10) {
      alert('Nicht genug Münzen! (10 🪙 benötigt)\nDu hast: ' + coins + ' 🪙');
      return;
    }
    addCoins(-10);
    updateStartScreen();
  }

  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameOverScreen').style.display = 'none';
  document.getElementById('winScreen').style.display = 'none';
  score = 0; lives = 3; ballLost = false; round = 0;
  updateHUD();
  bumpers.forEach(b => { b.hit = false; b.hitAnim = 0; });
  resetBall();
  running = false;    // frozen during countdown
  countdownText = '3'; // set immediately so loop keeps rendering
  if (animId) cancelAnimationFrame(animId);
  loop();             // start rendering with '3' visible

  // 3 → 2 → 1 → LOS! → start
  setTimeout(() => { countdownText = '2'; }, 1000);
  setTimeout(() => { countdownText = '1'; }, 2000);
  setTimeout(() => { countdownText = 'LOS!'; }, 3000);
  setTimeout(() => { countdownText = ''; running = true; }, 3600);
}

function updateHUD() {
  document.getElementById('scoreEl').textContent = score;
  document.getElementById('livesEl').textContent = '❤️'.repeat(Math.max(0,lives));
}

// ─── FLIPPER INPUT ────────────────────────────────────────────────────────────
function leftDown()  { lDown = true; }
function leftUp()    { lDown = false; }
function rightDown() { rDown = true; }
function rightUp()   { rDown = false; }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'z' || e.key === 'Z') leftDown();
  if (e.key === 'ArrowRight' || e.key === '/') rightDown();
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'z' || e.key === 'Z') leftUp();
  if (e.key === 'ArrowRight' || e.key === '/') rightUp();
});

// ─── PHYSICS ──────────────────────────────────────────────────────────────────
function moveFlipper(f, up) {
  const prevAngle = f.angle;
  if (f === leftFlipper) {
    f.target = up ? -0.5 : 0.5;
  } else {
    f.target = up ? Math.PI + 0.5 : Math.PI - 0.5;
  }
  const diff = f.target - f.angle;
  f.angle += diff * 0.25;          // snappier swing
  f.angularVel = f.angle - prevAngle;
}

function flipperPoint(f, t) {
  return {
    x: f.x + Math.cos(f.angle) * FLIPPER_LEN * t,
    y: f.y + Math.sin(f.angle) * FLIPPER_LEN * t,
  };
}

function distPointSeg(px, py, ax, ay, bx, by) {
  const dx = bx-ax, dy = by-ay;
  const len2 = dx*dx + dy*dy;
  if (len2 === 0) return Math.hypot(px-ax, py-ay);
  let t = ((px-ax)*dx + (py-ay)*dy) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax+t*dx), py - (ay+t*dy));
}

function reflectOffFlipper(f, t) {
  const p0 = flipperPoint(f, 0);
  const p1 = flipperPoint(f, 1);

  // Flipper surface normal (perpendicular, pointing away from table surface)
  const fDx = p1.x - p0.x, fDy = p1.y - p0.y;
  const fLen = Math.hypot(fDx, fDy);
  let nxn = -fDy / fLen, nyn = fDx / fLen;
  if (nyn > 0) { nxn = -nxn; nyn = -nyn; } // ensure normal points upward

  // Tip velocity from angular velocity: v = ω × arm (tangential)
  const arm = (t || 0) * FLIPPER_LEN;
  const tipVx = -f.angularVel * arm * Math.sin(f.angle);
  const tipVy =  f.angularVel * arm * Math.cos(f.angle);

  // Reflect relative velocity, then add tip momentum
  const relVx = ball.vx - tipVx * 0.5;
  const relVy = ball.vy - tipVy * 0.5;
  const dot = relVx * nxn + relVy * nyn;
  if (dot < 0) {
    ball.vx -= 2 * dot * nxn;
    ball.vy -= 2 * dot * nyn;
    ball.vx += tipVx * 0.8;
    ball.vy += tipVy * 0.8;

    // Minimum launch speed grows from base → tip (tip hits go higher)
    const minSpd = 5 + (t || 0) * 11; // 5 at pivot, 16 at tip
    const spd = Math.hypot(ball.vx, ball.vy);
    if (spd < minSpd) { ball.vx *= minSpd / spd; ball.vy *= minSpd / spd; }
    playBeep(300 + Math.round((t || 0) * 200), 0.09);
  }
}

function update() {
  if (!running) return;

  // Flipper angles
  moveFlipper(leftFlipper,  lDown);
  moveFlipper(rightFlipper, rDown);

  // Gravity
  ball.vy += 0.17;

  // Clamp max speed
  const sp = Math.hypot(ball.vx, ball.vy);
  if (sp > 16) { ball.vx *= 16/sp; ball.vy *= 16/sp; }

  ball.x += ball.vx;
  ball.y += ball.vy;

  // Wall bounces
  if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx)*0.85; }
  if (ball.x + BALL_R > W) { ball.x = W-BALL_R; ball.vx = -Math.abs(ball.vx)*0.85; }
  if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy)*0.85; }

  // Flipper collisions – find closest point t along flipper, use for physics
  [leftFlipper, rightFlipper].forEach(f => {
    const p0 = flipperPoint(f, 0);
    const p1 = flipperPoint(f, 1);
    const dx = p1.x - p0.x, dy = p1.y - p0.y;
    const len2 = dx*dx + dy*dy;
    const t = Math.max(0, Math.min(1, ((ball.x - p0.x)*dx + (ball.y - p0.y)*dy) / len2));
    const cx = p0.x + t*dx, cy = p0.y + t*dy;
    const dist = Math.hypot(ball.x - cx, ball.y - cy);
    if (dist < BALL_R + FLIPPER_THICK/2) {
      // Push ball out along the normal from the closest point
      const overlap = BALL_R + FLIPPER_THICK/2 - dist + 1;
      if (dist > 0.01) {
        ball.x += (ball.x - cx) / dist * overlap;
        ball.y += (ball.y - cy) / dist * overlap;
      } else {
        ball.y -= overlap;
      }
      reflectOffFlipper(f, t);
    }
  });

  // Guide wall collisions
  guideWalls.forEach(w => {
    const d = distPointSeg(ball.x, ball.y, w.ax, w.ay, w.bx, w.by);
    if (d < BALL_R + 3) {
      // Wall normal: perpendicular to the wall direction
      const wdx = w.bx - w.ax, wdy = w.by - w.ay;
      const wlen = Math.hypot(wdx, wdy);
      // Two candidate normals; pick the one pointing toward field interior (positive x toward center)
      let nx = -wdy / wlen, ny = wdx / wlen;
      // Make sure normal points inward (toward canvas center x = W/2)
      const toCenterX = W/2 - ball.x;
      if (nx * toCenterX < 0) { nx = -nx; ny = -ny; }
      // Push ball out of wall
      const overlap = BALL_R + 3 - d;
      ball.x += nx * overlap;
      ball.y += ny * overlap;
      // Reflect velocity
      const dot = ball.vx * nx + ball.vy * ny;
      if (dot < 0) {
        ball.vx -= 2 * dot * nx;
        ball.vy -= 2 * dot * ny;
        // Small energy loss
        ball.vx *= 0.85;
        ball.vy *= 0.85;
        playBeep(250, 0.06);
      }
    }
  });

  // Bumper collisions
  let allHit = true;
  bumpers.forEach(b => {
    if (b.hitAnim > 0) b.hitAnim -= 0.05;
    if (!b.hit) allHit = false;
    const dx = ball.x - b.x, dy = ball.y - b.y;
    const dist = Math.hypot(dx, dy);
    if (dist < BALL_R + BUMPER_R) {
      // Bounce off
      const nx = dx/dist, ny = dy/dist;
      ball.x = b.x + nx*(BALL_R + BUMPER_R + 1);
      ball.y = b.y + ny*(BALL_R + BUMPER_R + 1);
      const dot = ball.vx*nx + ball.vy*ny;
      ball.vx = (ball.vx - 2*dot*nx)*1.1;
      ball.vy = (ball.vy - 2*dot*ny)*1.1;
      const spd = Math.hypot(ball.vx, ball.vy);
      if (spd < 5) { ball.vx *= 5/spd; ball.vy *= 5/spd; }
      if (!b.hit) {
        b.hit = true;
        b.hitAnim = 1;
        score += 100;
        updateHUD();
        playBeep(600, 0.12);
        showFactoid(b.label + ' ' + b.name + ': ' + b.fact);
      } else {
        score += 10;
        updateHUD();
        b.hitAnim = 0.5;
        playBeep(440, 0.06);
      }
    }
  });

  // All bumpers hit: reset for next round (game continues!)
  if (allHit) {
    round++;
    addCoins(5);
    playBeep(880, 0.2);
    setTimeout(() => playBeep(1100, 0.15), 220);
    setTimeout(() => playBeep(1320, 0.12), 440);
    bumpers.forEach(b => { b.hit = false; b.hitAnim = 0; });
    // Show round banner briefly
    const banner = document.getElementById('roundBanner');
    document.getElementById('roundNum').textContent = round;
    banner.style.display = 'block';
    setTimeout(() => { banner.style.display = 'none'; }, 1800);
  }

  // Ball lost
  if (ball.y > H + 30 && !ballLost) {
    ballLost = true;
    lives--;
    updateHUD();
    playBeep(150, 0.15);
    if (lives <= 0) {
      running = false;
      saveFlipperHighscore(score);
      setTimeout(() => {
        document.getElementById('goScore').textContent = score;
        const roundMsg = round > 0
          ? round + (round === 1 ? ' Runde komplett!' : ' Runden komplett!') + ' Gut gespielt!'
          : 'Nicht schlecht – aber Jakob hätte weitergemacht!';
        document.getElementById('goRounds').textContent = roundMsg;
        document.getElementById('gameOverScreen').style.display = 'flex';
      }, 400);
    } else {
      setTimeout(() => { resetBall(); ballLost = false; }, 700);
    }
  }
}

// ─── DRAW ─────────────────────────────────────────────────────────────────────
function draw() {
  // Background – night sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0d1b3e');
  grad.addColorStop(1, '#1a2f5e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  const stars = [[20,30],[60,80],[100,15],[150,55],[200,25],[300,70],[350,20],[390,55],[50,120],[280,40]];
  stars.forEach(([sx,sy]) => {
    ctx.beginPath(); ctx.arc(sx, sy, 1.5, 0, Math.PI*2); ctx.fill();
  });

  // Side walls (decorative)
  ctx.strokeStyle = 'rgba(255,255,255,.15)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W, 0); ctx.lineTo(W, H); ctx.stroke();

  // Guide walls (angled gutters near flippers)
  ctx.lineCap = 'round';
  ctx.lineWidth = 5;
  ctx.strokeStyle = '#e67e22';
  ctx.shadowColor = '#f39c12';
  ctx.shadowBlur = 8;
  guideWalls.forEach(w => {
    ctx.beginPath();
    ctx.moveTo(w.ax, w.ay);
    ctx.lineTo(w.bx, w.by);
    ctx.stroke();
  });
  ctx.shadowBlur = 0;

  // Bumpers
  bumpers.forEach(b => {
    const glow = b.hitAnim;
    const r = BUMPER_R + glow * 8;

    // Glow
    if (glow > 0) {
      const rg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r*1.8);
      rg.addColorStop(0, b.color + 'aa');
      rg.addColorStop(1, 'transparent');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(b.x, b.y, r*1.8, 0, Math.PI*2); ctx.fill();
    }

    // Circle
    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, Math.PI*2);
    ctx.fillStyle = b.hit ? b.color : 'rgba(255,255,255,.12)';
    ctx.fill();
    ctx.strokeStyle = b.hit ? '#fff' : b.color;
    ctx.lineWidth = 3;
    ctx.stroke();

    // Hit indicator: small ✓ when bumper already hit
    if (b.hit) {
      ctx.font = `bold ${Math.round(16 + glow*3)}px Segoe UI,sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff';
      ctx.fillText('✓', b.x, b.y);
    }
  });

  // Flippers
  drawFlipper(leftFlipper);
  drawFlipper(rightFlipper);

  // Ball
  const bg = ctx.createRadialGradient(ball.x-3, ball.y-3, 1, ball.x, ball.y, BALL_R);
  bg.addColorStop(0, '#fff');
  bg.addColorStop(1, '#f39c12');
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2);
  ctx.fillStyle = bg;
  ctx.fill();

  // Drain zone indicator
  ctx.strokeStyle = 'rgba(231,76,60,.4)';
  ctx.lineWidth = 2;
  ctx.setLineDash([6,4]);
  ctx.beginPath(); ctx.moveTo(0, H-20); ctx.lineTo(W, H-20); ctx.stroke();
  ctx.setLineDash([]);

  // Countdown overlay
  if (countdownText) {
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `bold ${Math.round(W * 0.28)}px Segoe UI, Arial, sans-serif`;
    ctx.fillStyle = countdownText === 'LOS!' ? '#27ae60' : '#f39c12';
    ctx.shadowColor = 'rgba(0,0,0,0.7)';
    ctx.shadowBlur = 20;
    ctx.fillText(countdownText, W/2, H/2);
    ctx.shadowBlur = 0;
  }
}

function drawFlipper(f) {
  const p0 = flipperPoint(f, 0);
  const p1 = flipperPoint(f, 1);
  ctx.lineCap = 'round';
  ctx.lineWidth = FLIPPER_THICK;
  ctx.strokeStyle = lDown && f === leftFlipper ? '#f39c12' :
                    rDown && f === rightFlipper ? '#f39c12' : '#e67e22';
  ctx.beginPath();
  ctx.moveTo(p0.x, p0.y);
  ctx.lineTo(p1.x, p1.y);
  ctx.stroke();
}

// ─── AUDIO ───────────────────────────────────────────────────────────────────
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
}
function playBeep(freq, dur) {
  try {
    ensureAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

// ─── FACTOID ─────────────────────────────────────────────────────────────────
function showFactoid(text) {
  const el = document.getElementById('factoid');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(factoidTimer);
  factoidTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

// ─── LOOP ────────────────────────────────────────────────────────────────────
function loop() {
  update();
  draw();
  // Keep looping while running OR during countdown (countdownText set)
  if (running || countdownText) animId = requestAnimationFrame(loop);
}

// ─── INIT ────────────────────────────────────────────────────────────────────
resize();
window.addEventListener('resize', resize);
updateStartScreen();
</script>
