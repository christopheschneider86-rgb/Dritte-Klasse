<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" width="260" height="220">
  <!-- Pauken - kesselförmig auf Stativ, mit Schlägeln -->
  <!-- Linke Pauke -->
  <!-- Kessel -->
  <path d="M30 80 Q30 145 65 150 Q100 155 100 150 Q135 145 135 80Z" fill="#c0c0c0" stroke="#888" stroke-width="2"/>
  <!-- Fell (Membran oben) -->
  <ellipse cx="82" cy="80" rx="52" ry="16" fill="#e8e0d0" stroke="#aaa" stroke-width="2"/>
  <!-- Spannreifen -->
  <ellipse cx="82" cy="80" rx="52" ry="16" fill="none" stroke="#999" stroke-width="4"/>
  <!-- Stimmschrauben -->
  <circle cx="42" cy="89" r="4" fill="#aaa" stroke="#777" stroke-width="1.5"/>
  <circle cx="55" cy="83" r="4" fill="#aaa" stroke="#777" stroke-width="1.5"/>
  <circle cx="70" cy="80" r="4" fill="#aaa" stroke="#777" stroke-width="1.5"/>
  <circle cx="94" cy="80" r="4" fill="#aaa" stroke="#777" stroke-width="1.5"/>
  <circle cx="109" cy="83" r="4" fill="#aaa" stroke="#777" stroke-width="1.5"/>
  <circle cx="122" cy="89" r="4" fill="#aaa" stroke="#777" stroke-width="1.5"/>
  <!-- Stativ links Pauke -->
  <line x1="50" y1="152" x2="40" y2="195" stroke="#888" stroke-width="4"/>
  <line x1="82" y1="155" x2="82" y2="195" stroke="#888" stroke-width="4"/>
  <line x1="115" y1="152" x2="124" y2="195" stroke="#888" stroke-width="4"/>
  <!-- Füße -->
  <line x1="30" y1="195" x2="50" y2="195" stroke="#888" stroke-width="4" stroke-linecap="round"/>
  <line x1="74" y1="195" x2="94" y2="195" stroke="#888" stroke-width="4" stroke-linecap="round"/>
  <line x1="116" y1="195" x2="134" y2="195" stroke="#888" stroke-width="4" stroke-linecap="round"/>
  <!-- Stimmpedalverbindung -->
  <path d="M82 155 C82 170 70 178 60 175" fill="none" stroke="#666" stroke-width="2.5"/>
  <!-- Rechte Pauke (etwas größer) -->
  <path d="M130 72 Q130 140 170 146 Q210 151 210 146 Q250 140 250 72Z" fill="#b8b8b8" stroke="#888" stroke-width="2"/>
  <!-- Fell rechte Pauke -->
  <ellipse cx="190" cy="72" rx="60" ry="18" fill="#e8e0d0" stroke="#aaa" stroke-width="2"/>
  <ellipse cx="190" cy="72" rx="60" ry="18" fill="none" stroke="#999" stroke-width="4"/>
  <!-- Stimmschrauben rechte Pauke -->
  <circle cx="145" cy="83" r="4" fill="#aaa" stroke="#777" stroke-width="1.5"/>
  <circle cx="160" cy="76" r="4" fill="#aaa" stroke="#777" stroke-width="1.5"/>
  <circle cx="178" cy="72" r="4" fill="#aaa" stroke="#777" stroke-width="1.5"/>
  <circle cx="202" cy="72" r="4" fill="#aaa" stroke="#777" stroke-width="1.5"/>
  <circle cx="220" cy="76" r="4" fill="#aaa" stroke="#777" stroke-width="1.5"/>
  <circle cx="234" cy="83" r="4" fill="#aaa" stroke="#777" stroke-width="1.5"/>
  <!-- Stativ rechte Pauke -->
  <line x1="155" y1="148" x2="144" y2="195" stroke="#888" stroke-width="4"/>
  <line x1="190" y1="150" x2="190" y2="195" stroke="#888" stroke-width="4"/>
  <line x1="226" y1="148" x2="238" y2="195" stroke="#888" stroke-width="4"/>
  <!-- Füße rechte Pauke -->
  <line x1="134" y1="195" x2="154" y2="195" stroke="#888" stroke-width="4" stroke-linecap="round"/>
  <line x1="182" y1="195" x2="202" y2="195" stroke="#888" stroke-width="4" stroke-linecap="round"/>
  <line x1="228" y1="195" x2="248" y2="195" stroke="#888" stroke-width="4" stroke-linecap="round"/>
  <!-- Schlägel (2 Stück, quer über beide Pauken) -->
  <line x1="60" y1="30" x2="110" y2="78" stroke="#6B3A1F" stroke-width="5" stroke-linecap="round"/>
  <circle cx="60" cy="28" r="9" fill="#ddd" stroke="#999" stroke-width="2"/>
  <line x1="170" y1="25" x2="130" y2="70" stroke="#6B3A1F" stroke-width="5" stroke-linecap="round"/>
  <circle cx="172" cy="23" r="9" fill="#ddd" stroke="#999" stroke-width="2"/>
  <!-- Label -->

</svg>