<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <!-- Querflöte - waagerecht liegend (quer gehalten!) -->
  <!-- Hauptrohr -->
  <rect x="15" y="48" width="290" height="22" rx="10" fill="#ddd" stroke="#999" stroke-width="2"/>
  <!-- Glanzeffekt -->
  <rect x="15" y="50" width="290" height="8" rx="8" fill="white" opacity="0.4"/>
  <!-- Mundloch (Embouchure) -->
  <ellipse cx="55" cy="59" rx="9" ry="6" fill="#888" stroke="#666" stroke-width="1.5"/>
  <!-- Mundloch-Platte -->
  <rect x="40" y="44" width="30" height="30" rx="5" fill="#ccc" stroke="#999" stroke-width="1.5"/>
  <ellipse cx="55" cy="59" rx="8" ry="5" fill="#777"/>
  <!-- Kopfstück links (Verschluss) -->
  <ellipse cx="22" cy="59" rx="8" ry="12" fill="#bbb" stroke="#888" stroke-width="1.5"/>
  <!-- Klappen - charakteristische viele Klappen der Querflöte -->
  <!-- Kleine Klappen -->
  <circle cx="90" cy="56" r="6" fill="#aaa" stroke="#777" stroke-width="1.5"/>
  <circle cx="108" cy="64" r="6" fill="#aaa" stroke="#777" stroke-width="1.5"/>
  <circle cx="125" cy="56" r="6" fill="#aaa" stroke="#777" stroke-width="1.5"/>
  <circle cx="142" cy="64" r="6" fill="#aaa" stroke="#777" stroke-width="1.5"/>
  <circle cx="158" cy="56" r="6" fill="#aaa" stroke="#777" stroke-width="1.5"/>
  <circle cx="175" cy="64" r="6" fill="#aaa" stroke="#777" stroke-width="1.5"/>
  <circle cx="192" cy="56" r="6" fill="#aaa" stroke="#777" stroke-width="1.5"/>
  <!-- Große Klappen (Ringklappen) -->
  <circle cx="210" cy="64" r="8" fill="none" stroke="#777" stroke-width="2.5"/>
  <circle cx="210" cy="64" r="4" fill="#aaa"/>
  <circle cx="230" cy="56" r="8" fill="none" stroke="#777" stroke-width="2.5"/>
  <circle cx="230" cy="56" r="4" fill="#aaa"/>
  <circle cx="250" cy="64" r="8" fill="none" stroke="#777" stroke-width="2.5"/>
  <circle cx="250" cy="64" r="4" fill="#aaa"/>
  <circle cx="270" cy="56" r="8" fill="none" stroke="#777" stroke-width="2.5"/>
  <circle cx="270" cy="56" r="4" fill="#aaa"/>
  <!-- Klappenmechanik Verbindungen -->
  <line x1="90" y1="59" x2="108" y2="59" stroke="#888" stroke-width="1.5"/>
  <line x1="125" y1="59" x2="158" y2="59" stroke="#888" stroke-width="1.5"/>
  <line x1="175" y1="59" x2="210" y2="59" stroke="#888" stroke-width="1.5"/>
  <line x1="230" y1="59" x2="270" y2="59" stroke="#888" stroke-width="1.5"/>
  <!-- Fußstück rechts (angewinkelt) -->
  <rect x="285" y="44" width="20" height="30" rx="8" fill="#ccc" stroke="#999" stroke-width="1.5"/>
  <!-- Label -->

</svg>