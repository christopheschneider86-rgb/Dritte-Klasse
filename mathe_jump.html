<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mathe-Hüpfer - Gadgets Update</title>
    <style>
        body { margin: 0; background: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Comic Sans MS', sans-serif; overflow: hidden; touch-action: none; }
        #gameContainer { position: relative; width: 400px; height: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 15px; overflow: hidden; }
        canvas { background: linear-gradient(to bottom, #74ebd5 0%, #9face6 100%); display: block; }
        #ui { position: absolute; top: 10px; left: 15px; right: 15px; display: flex; justify-content: space-between; color: white; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 0 rgba(0,0,0,0.5); pointer-events: none; display: none; }
        #activeGadget { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); font-size: 28px; background: rgba(0,0,0,0.4); padding: 6px 16px; border-radius: 20px; color: white; pointer-events: none; display: none; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
        .overlay h2 { font-size: 36px; margin-bottom: 20px; color: #f1c40f; text-shadow: 2px 2px 0 #000; }
        button { padding: 12px 25px; font-size: 20px; font-family: inherit; font-weight: bold; color: white; border: 3px solid #fff; border-radius: 10px; cursor: pointer; margin: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.1s; }
        button:active { transform: scale(0.95); }
        .btn-addsub { background: #2ecc71; }
        .btn-muldiv { background: #3498db; }
        .btn-mixed { background: #9b59b6; }
        .btn-retry { background: #e67e22; }
        .btn-menu { background: #7f8c8d; font-size: 16px; padding: 10px 20px; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="ui">
            <span id="scoreText">Höhe: 0</span>
            <span id="highText">Highscore: 0</span>
        </div>
        <div id="activeGadget"></div>
        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <div id="startScreen" class="overlay">
            <h2>Was möchtest<br>du üben?</h2>
            <button class="btn-addsub" onclick="startGame('addsub')">➕ und ➖</button>
            <button class="btn-muldiv" onclick="startGame('muldiv')">✖️ und ➗</button>
            <button class="btn-mixed" onclick="startGame('mixed')">Gemischt 🎲</button>
        </div>

        <div id="gameOver" class="overlay" style="display: none;">
            <h2 style="color: #e74c3c;">Oh nein!</h2>
            <p>Die Plattform ist zerbrochen.</p>
            <p id="finalScore" style="font-size: 28px; font-weight: bold;">Höhe: 0</p>
            <button class="btn-retry" onclick="resetGame()">Nochmal hüpfen</button>
            <button class="btn-menu" onclick="showMenu()">Zurück zum Menü</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreText = document.getElementById('scoreText');
        const highText = document.getElementById('highText');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOver');
        const ui = document.getElementById('ui');
        const activeGadgetEl = document.getElementById('activeGadget');

        // Audio
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const t = audioCtx.currentTime;
            if (type === 'jump') { osc.type='sine'; osc.frequency.setValueAtTime(400,t); osc.frequency.exponentialRampToValueAtTime(800,t+0.1); gain.gain.setValueAtTime(0.2,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.1); osc.start(); osc.stop(t+0.1); }
            else if (type === 'break') { osc.type='sawtooth'; osc.frequency.setValueAtTime(150,t); osc.frequency.exponentialRampToValueAtTime(30,t+0.2); gain.gain.setValueAtTime(0.3,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.2); osc.start(); osc.stop(t+0.2); }
            else if (type === 'spring') { osc.type='square'; osc.frequency.setValueAtTime(300,t); osc.frequency.exponentialRampToValueAtTime(900,t+0.3); gain.gain.setValueAtTime(0.2,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.3); osc.start(); osc.stop(t+0.3); }
            else if (type === 'rocket') { osc.type='sawtooth'; osc.frequency.setValueAtTime(100,t); osc.frequency.linearRampToValueAtTime(600,t+1.2); gain.gain.setValueAtTime(0.4,t); gain.gain.exponentialRampToValueAtTime(0.01,t+1.2); osc.start(); osc.stop(t+1.2); }
            else if (type === 'shield') { osc.type='sine'; osc.frequency.setValueAtTime(500,t); osc.frequency.setValueAtTime(700,t+0.1); osc.frequency.setValueAtTime(900,t+0.2); gain.gain.setValueAtTime(0.2,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.3); osc.start(); osc.stop(t+0.3); }
            else if (type === 'star') { osc.type='sine'; osc.frequency.setValueAtTime(800,t); osc.frequency.exponentialRampToValueAtTime(1200,t+0.15); gain.gain.setValueAtTime(0.2,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.15); osc.start(); osc.stop(t+0.15); }
            else if (type === 'slow') { osc.type='sine'; osc.frequency.setValueAtTime(300,t); osc.frequency.linearRampToValueAtTime(100,t+0.5); gain.gain.setValueAtTime(0.2,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.5); osc.start(); osc.stop(t+0.5); }
        }

        // Physik-Konstanten
        const BASE_GRAVITY = 0.25;
        const jumpForce = -9;
        const springForce = -15;
        const rocketSpeed = -18;

        let gameRunning = false;
        let currentMode = 'mixed';
        let score = 0;
        let highScore = 0;
        let scoreMultiplier = 1;      // Für den Stern
        let shieldActive = false;     // Schutzschild
        let slowActive = false;       // Zeitlupe
        let slowTimer = 0;
        let starTimer = 0;
        let activeGadgetLabel = '';

        let player = { x: 200, y: 300, radius: 12, vy: 0, state: 'normal', timer: 0 };
        let targetX = player.x;

        let platforms = [];
        const platformWidth = 90;
        const platformHeight = 50;

        // Alle möglichen Gadgets mit Gewichtung (höher = seltener)
        const GADGETS = [
            { id: 'rocket',  emoji: '🚀', label: '🚀 Rakete!',     chance: 0.06 },
            { id: 'spring',  emoji: '🌀', label: '🌀 Superfeder!', chance: 0.12 },
            { id: 'shield',  emoji: '🛡️', label: '🛡️ Schutzschild!', chance: 0.10 },
            { id: 'star',    emoji: '⭐', label: '⭐ Doppelpunkte!', chance: 0.08 },
            { id: 'slow',    emoji: '❄️', label: '❄️ Zeitlupe!',   chance: 0.08 },
        ];

        function pickGadget() {
            let r = Math.random();
            let total = 0;
            for (let g of GADGETS) {
                total += g.chance;
                if (r < total) return g.id;
            }
            return null;
        }

        function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

        function generateMathProblem() {
            let a, b, ans, equation, op;
            let ops = currentMode === 'addsub' ? ['+','-'] : currentMode === 'muldiv' ? ['*','÷'] : ['+','-','*','÷'];
            op = ops[Math.floor(Math.random() * ops.length)];
            if (op==='+') { a=rnd(10,50); b=rnd(10,50); ans=a+b; equation=`${a} + ${b}`; }
            else if (op==='-') { a=rnd(20,100); b=rnd(5,a-1); ans=a-b; equation=`${a} - ${b}`; }
            else if (op==='*') { a=rnd(2,10); b=rnd(2,10); ans=a*b; equation=`${a} × ${b}`; }
            else { b=rnd(2,10); ans=rnd(2,10); a=b*ans; equation=`${a} ÷ ${b}`; }
            let wrongAns;
            do { wrongAns = ans + rnd(1,5) * (Math.random()>0.5?1:-1); } while(wrongAns<0||wrongAns===ans);
            return { equation, ans, wrongAns };
        }

        function createFloor(yOffset) {
            if (Math.random() < 0.15) {
                platforms.push({ x: rnd(80,230), y: yOffset, width: platformWidth, type: 'cloud', item: null });
            } else {
                let prob = generateMathProblem();
                let opts = [prob.ans, prob.wrongAns].sort(() => Math.random()-0.5);
                let xPos1 = rnd(10, 110);
                let xPos2 = rnd(200, 300);

                // Gadgets können auf BEIDEN Plattformen erscheinen
                let gadgetFor1 = pickGadget();
                let gadgetFor2 = pickGadget();

                platforms.push({ x: xPos1, y: yOffset, width: platformWidth, type: 'math',
                    correct: opts[0]===prob.ans, equation: prob.equation, ansText: opts[0],
                    broken: false, item: gadgetFor1 });
                platforms.push({ x: xPos2, y: yOffset, width: platformWidth, type: 'math',
                    correct: opts[1]===prob.ans, equation: prob.equation, ansText: opts[1],
                    broken: false, item: gadgetFor2 });
            }
        }

        function initPlatforms() {
            platforms = [];
            platforms.push({ x: 155, y: 550, width: platformWidth, type: 'cloud', item: null });
            for(let i=1; i<7; i++) { createFloor(550 - i * 115); }
        }

        function showGadgetLabel(label) {
            activeGadgetEl.innerText = label;
            activeGadgetEl.style.display = 'block';
            clearTimeout(activeGadgetEl._timer);
            activeGadgetEl._timer = setTimeout(() => { activeGadgetEl.style.display = 'none'; }, 2000);
        }

        function activateGadget(type) {
            if (type === 'rocket') { playSound('rocket'); player.state='rocket'; player.timer=80; showGadgetLabel('🚀 Rakete!'); }
            else if (type === 'spring') { playSound('spring'); player.vy=springForce; showGadgetLabel('🌀 Superfeder!'); }
            else if (type === 'shield') { playSound('shield'); shieldActive=true; showGadgetLabel('🛡️ Schutzschild!'); }
            else if (type === 'star') { playSound('star'); scoreMultiplier=2; starTimer=300; showGadgetLabel('⭐ Doppelpunkte!'); }
            else if (type === 'slow') { playSound('slow'); slowActive=true; slowTimer=180; showGadgetLabel('❄️ Zeitlupe!'); }
        }

        const keys = {};
        window.addEventListener('keydown', e => keys[e.key]=true);
        window.addEventListener('keyup', e => keys[e.key]=false);
        canvas.addEventListener('mousemove', e => { targetX = e.clientX - canvas.getBoundingClientRect().left; });
        canvas.addEventListener('touchmove', e => { targetX = e.touches[0].clientX - canvas.getBoundingClientRect().left; e.preventDefault(); }, {passive:false});

        function update() {
            if(!gameRunning) return;

            let currentGravity = slowActive ? BASE_GRAVITY * 0.45 : BASE_GRAVITY;
            let moveSpeed = slowActive ? 5 : 8;

            if (keys['ArrowLeft']||keys['a']) targetX -= moveSpeed;
            if (keys['ArrowRight']||keys['d']) targetX += moveSpeed;

            // Gadget-Timer
            if (slowTimer > 0) { slowTimer--; if(slowTimer<=0) { slowActive=false; } }
            if (starTimer > 0) { starTimer--; if(starTimer<=0) { scoreMultiplier=1; } }

            if (player.state === 'rocket') {
                player.vy = rocketSpeed; player.timer--;
                if(player.timer<=0) { player.state='normal'; player.vy=jumpForce; }
            } else {
                player.vy += currentGravity;
            }

            player.x += (targetX - player.x) * 0.2;
            if(player.x > canvas.width + player.radius) { player.x = -player.radius; targetX=player.x; }
            if(player.x < -player.radius) { player.x = canvas.width + player.radius; targetX=player.x; }

            player.y += player.vy;

            // Kollision
            if (player.vy > 0 && player.state !== 'rocket') {
                let landed = null;
                for (let p of platforms) {
                    if (p.broken) continue;
                    let hitX = player.x > p.x-(player.radius/2) && player.x < p.x+p.width+(player.radius/2);
                    let hitY = player.y+player.radius >= p.y && player.y+player.radius <= p.y+18;
                    if (hitX && hitY) { landed = p; break; }
                }

                if (landed) {
                    if (landed.type==='cloud' || landed.correct) {
                        // Gadget aktivieren (nur auf richtigen/sicheren Plattformen!)
                        if (landed.item) { activateGadget(landed.item); landed.item=null; }
                        else { playSound('jump'); player.vy=jumpForce; }
                        player.y = landed.y - player.radius;
                    } else {
                        // Falsche Plattform: Schutzschild prüfen
                        if (shieldActive) {
                            shieldActive = false;
                            playSound('shield');
                            player.vy = jumpForce; // Trotzdem abspringen
                            player.y = landed.y - player.radius;
                            landed.broken = true;
                            showGadgetLabel('🛡️ Schutzschild benutzt!');
                        } else {
                            playSound('break'); landed.broken = true;
                        }
                    }
                }
            }

            // Kamera
            let halfScreen = canvas.height / 2;
            if (player.y < halfScreen) {
                let diff = halfScreen - player.y;
                player.y = halfScreen;
                score += Math.floor(diff/5) * scoreMultiplier;
                scoreText.innerText = "Höhe: " + score;
                platforms.forEach(p => p.y += diff);
            }

            platforms = platforms.filter(p => p.y < canvas.height+50);
            if (platforms[platforms.length-1].y > 100) createFloor(platforms[platforms.length-1].y - 115);

            if (player.y > canvas.height) {
                gameRunning = false;
                if(score > highScore) { highScore=score; localStorage.setItem('doodleMathHigh_'+currentMode, highScore); }
                document.getElementById('finalScore').innerText = "Erreichte Höhe: " + score;
                gameOverScreen.style.display = 'flex';
                ui.style.display = 'none';
                activeGadgetEl.style.display = 'none';
            }
        }

        function drawGadgetIcon(p) {
            if (!p.item) return;
            let g = GADGETS.find(g => g.id === p.item);
            if (!g) return;
            ctx.font = '20px serif';
            ctx.textAlign = 'center';
            ctx.fillText(g.emoji, p.x + p.width/2, p.y - 8);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Zeitlupe = bläulicher Bildschirm-Effekt
            if (slowActive) { ctx.fillStyle='rgba(100,180,255,0.07)'; ctx.fillRect(0,0,canvas.width,canvas.height); }
            // Schutzschild = goldener Rand-Effekt
            if (shieldActive) { ctx.strokeStyle='rgba(255,215,0,0.5)'; ctx.lineWidth=8; ctx.strokeRect(4,4,canvas.width-8,canvas.height-8); }
            // Doppelpunkte = orangener Rand-Effekt
            if (scoreMultiplier>1) { ctx.strokeStyle='rgba(255,140,0,0.5)'; ctx.lineWidth=8; ctx.strokeRect(4,4,canvas.width-8,canvas.height-8); }

            for (let p of platforms) {
                if (p.broken) {
                    ctx.fillStyle='rgba(231,76,60,0.5)';
                    ctx.fillRect(p.x, p.y+10, p.width/2-2, platformHeight);
                    ctx.fillRect(p.x+p.width/2+2, p.y+20, p.width/2-2, platformHeight);
                    continue;
                }
                if (p.type === 'cloud') {
                    ctx.fillStyle='rgba(255,255,255,0.9)';
                    ctx.beginPath(); ctx.arc(p.x+15,p.y+20,18,0,Math.PI*2); ctx.arc(p.x+45,p.y+10,22,0,Math.PI*2); ctx.arc(p.x+75,p.y+20,18,0,Math.PI*2); ctx.fill();
                } else {
                    // Farbe je nach richtig/falsch (leicht unterschiedlich – hilft NICHT beim Raten, nur zur Ästhetik)
                    ctx.fillStyle = '#f8c291';
                    ctx.beginPath();
                    if(ctx.roundRect) ctx.roundRect(p.x,p.y,p.width,platformHeight,8); else ctx.rect(p.x,p.y,p.width,platformHeight);
                    ctx.fill();
                    ctx.lineWidth=3; ctx.strokeStyle='#e55039'; ctx.stroke();

                    ctx.fillStyle='#2c3e50'; ctx.font='bold 16px Comic Sans MS'; ctx.textAlign='center';
                    ctx.fillText(p.equation, p.x+p.width/2, p.y+20);
                    ctx.fillStyle='#c0392b'; ctx.font='bold 20px Comic Sans MS';
                    ctx.fillText("= " + p.ansText, p.x+p.width/2, p.y+42);
                }
                // Gadget-Icon IMMER anzeigen (auch auf falschen Plattformen – die "Falle"!)
                drawGadgetIcon(p);
            }

            if (gameRunning) {
                // Schutzschild-Aura um den Ball
                if (shieldActive) {
                    ctx.beginPath(); ctx.arc(player.x, player.y, player.radius+8, 0, Math.PI*2);
                    ctx.fillStyle='rgba(255,215,0,0.25)'; ctx.fill();
                    ctx.strokeStyle='gold'; ctx.lineWidth=2; ctx.stroke();
                }
                // Doppelpunkte-Aura
                if (scoreMultiplier > 1) {
                    ctx.beginPath(); ctx.arc(player.x, player.y, player.radius+8, 0, Math.PI*2);
                    ctx.fillStyle='rgba(255,140,0,0.25)'; ctx.fill();
                }

                ctx.fillStyle = player.state==='rocket' ? '#f1c40f' : '#38ada9';
                ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2); ctx.fill();
                ctx.lineWidth=2; ctx.strokeStyle='#fff'; ctx.stroke();

                if (player.state==='rocket') {
                    ctx.fillStyle='#e55039'; ctx.beginPath();
                    ctx.moveTo(player.x-6, player.y+player.radius);
                    ctx.lineTo(player.x, player.y+player.radius+rnd(15,25));
                    ctx.lineTo(player.x+6, player.y+player.radius); ctx.fill();
                }
            }

            requestAnimationFrame(() => { update(); draw(); });
        }

        function startGame(mode) {
            if(audioCtx.state==='suspended') audioCtx.resume();
            currentMode=mode;
            highScore=localStorage.getItem('doodleMathHigh_'+currentMode)||0;
            startScreen.style.display='none';
            ui.style.display='flex';
            resetGame();
        }

        function showMenu() {
            gameOverScreen.style.display='none';
            startScreen.style.display='flex';
            gameRunning=false;
        }

        function resetGame() {
            player={x:200, y:300, radius:12, vy:0, state:'normal', timer:0};
            targetX=200; score=0; scoreMultiplier=1; shieldActive=false; slowActive=false; slowTimer=0; starTimer=0;
            scoreText.innerText="Höhe: 0";
            highText.innerText="Highscore: "+highScore;
            gameOverScreen.style.display='none';
            ui.style.display='flex';
            activeGadgetEl.style.display='none';
            for(let k in keys) keys[k]=false;
            initPlatforms(); gameRunning=true;
        }

        document.body.addEventListener('click', ()=>{ if(audioCtx.state==='suspended') audioCtx.resume(); },{once:true});
        document.body.addEventListener('touchstart', ()=>{ if(audioCtx.state==='suspended') audioCtx.resume(); },{once:true});

        draw();
    </script>
</body>
</html>
