<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Mathe-Trainer 3. Klasse Bayern</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<style>
:root {
  --bg: #e9f4ff;
  --card: #ffffff;
  --accent: #3498db;
  --accent-soft: #d6ecff;
  --danger: #e74c3c;
  --success: #27ae60;
  --text: #222222;
  --muted: #666666;
  --radius: 18px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; display: flex; justify-content: center;
}
.app{ width:100%; max-width:1000px; padding:12px; }
.card{
  background:var(--card); border-radius:var(--radius);
  box-shadow:0 8px 24px rgba(0,0,0,0.08); padding:16px;
}
.header{ display:flex; align-items:center; gap:16px; margin-bottom:14px; }
.app-icon{
  width:64px; height:64px; border-radius:16px; object-fit:cover;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}
.icon-fallback{
  width:64px; height:64px; border-radius:16px; background:#3498db;
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:36px; font-weight:bold; display:none;
}
.header-text h1{ font-size:22px; margin-bottom:4px; color:#2c3e50; }
.header-text p{ font-size:14px; color:var(--muted); }
.profile-bar, .score-bar{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:12px; flex-wrap:wrap; gap:8px;
}
.score-bar{ padding:10px 14px; border-radius:16px; background:var(--accent-soft); font-size:14px; }
.score-bar strong{ font-size:16px; color:#1b6fab; }
.stars{ color:#f39c12; font-size:18px; letter-spacing:2px; }
select, .btn{ padding:8px 14px; border-radius:12px; font-size:14px; border:none; cursor:pointer; }
select{ border:1px solid #ccd8e6; background:#f8fbff; font-weight:bold;}
.btn-primary{ background:var(--accent); color:white; font-weight:bold; }
.btn-secondary{ background:#ecf0f1; color:var(--text); }
.btn-danger{ background:#ffe4e1; color:#c0392b; }
.btn:active{ transform:scale(0.96); }

.main-layout{ display:grid; grid-template-columns: 1fr 1.1fr; gap:16px; }
@media(max-width:800px){ .main-layout{ grid-template-columns:1fr; } }

.tile-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:12px; }
.tile{
  background:#f7fbff; border-radius:16px; padding:12px; border:2px solid #d9e8f7;
  cursor:pointer; transition:all .2s; min-height:95px; display:flex; flex-direction:column;
}
.tile:hover, .tile.active{ border-color:var(--accent); background:#edf5fc; transform:translateY(-2px); }
.tile-title{ font-size:15px; font-weight:bold; margin-bottom:4px; color:#2c3e50; }
.tile-sub{ font-size:11px; color:var(--muted); }

.panel-title{ font-size:18px; font-weight:bold; margin-bottom:4px; color:#2c3e50; }
.task-box{
  margin-top:12px; padding:20px; border-radius:16px; background:#fdfdfd;
  border:2px solid #e1e8f0; text-align:center; box-shadow:inset 0 2px 10px rgba(0,0,0,0.02);
}
.task-question{ font-size:22px; font-weight:bold; margin-bottom:10px; color:#2c3e50; }
.visual-container{ margin:15px 0; display:flex; justify-content:center; }
.task-hint{ font-size:13px; color:var(--muted); margin-bottom:15px; }

/* VISUELLE ELEMENTE (Mauer, Tausenderbuch, Inputs) */
.mauer-row{ display:flex; justify-content:center; gap:8px; margin-bottom:8px; }
.brick{
  width:75px; height:50px; background:#e67e22; border-radius:8px;
  border:2px solid #d35400; display:flex; align-items:center; justify-content:center;
  font-size:20px; font-weight:bold; color:white; box-shadow:0 4px 0 #b33c00;
}
.brick input{
  width:100%; height:100%; border:none; background:white; border-radius:6px;
  text-align:center; font-size:22px; font-weight:bold; color:#d35400;
}
.brick input:focus{ outline:none; box-shadow:inset 0 0 0 3px #f1c40f; }

.tausender-cross{ display:grid; grid-template-columns: 60px 60px 60px; gap:6px; justify-content:center; }
.t-cell{ width:60px; height:60px; border-radius:8px; }
.t-center{ background:#3498db; color:white; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:bold; box-shadow:0 4px 0 #2980b9;}
.t-input{
  width:100%; height:100%; text-align:center; font-size:20px; font-weight:bold;
  border:2px solid #bdc3c7; border-radius:8px; background:#fff;
}
.t-input:focus{ border-color:#3498db; outline:none; }

.std-input{
  width:90px; padding:10px; font-size:24px; font-weight:bold; text-align:center;
  border:3px solid #ccd8e6; border-radius:12px; margin:0 5px;
}
.std-input:focus{ border-color:#3498db; outline:none; }

.feedback{ margin-top:15px; font-size:16px; font-weight:bold; min-height:24px; }
.feedback.ok{ color:var(--success); }
.feedback.bad{ color:var(--danger); }

/* Statistik */
.stats-card{ background:#fdfdfd; border-radius:16px; padding:12px; border:2px solid #e1e8f0; margin-top:10px;}
.stats-row{ display:flex; align-items:center; font-size:13px; margin-bottom:6px; }
.stats-bar{ flex:1; height:10px; background:#ecf0f1; border-radius:10px; margin:0 10px; overflow:hidden; }
.stats-fill{ height:100%; background:var(--success); transition:width 0.5s; }
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <div class="header">
      <link rel="icon" type="image/png" href="icon.png">
      <link rel="apple-touch-icon" href="icon.png">
      <img src="icon.png" class="app-icon" alt="Icon" onerror="this.style.display='none'; document.getElementById('icon-fb').style.display='flex';">
      <div id="icon-fb" class="icon-fallback">M</div>
      <div class="header-text">
        <h1>Mathe-Trainer 3. Klasse</h1>
        <p>LehrplanPLUS Bayern · Visuelles Lernen</p>
      </div>
    </div>

    <!-- Profil & Stats -->
    <div class="profile-bar">
      <div>
        <select id="profileSelect"></select>
      </div>
      <div>
        <button class="btn btn-secondary" id="addBtn">Neues Kind</button>
        <button class="btn btn-danger" id="delBtn">Profil löschen</button>
      </div>
    </div>

    <div class="score-bar">
      <div><strong id="scoreText">Punkte: 0</strong></div>
      <div class="stars" id="starsText">☆ ☆ ☆ ☆ ☆</div>
    </div>

    <div class="main-layout">
      <!-- Links: Menü -->
      <div>
        <div class="panel-title">Was üben wir heute?</div>
        <div class="tile-grid" id="taskTiles"></div>
      </div>

      <!-- Rechts: Aufgabe -->
      <div>
        <div class="panel-title" id="taskTitle">Aktuelle Aufgabe</div>
        <div class="task-box">
          <div class="task-question" id="tQuestion">Wähle links ein Thema!</div>
          <div class="visual-container" id="tVisual"></div>
          <div class="task-hint" id="tHint"></div>
          
          <div style="margin-top:15px;">
            <button class="btn btn-primary" id="checkBtn" style="padding:12px 24px; font-size:16px;" disabled>Antwort prüfen</button>
            <button class="btn btn-secondary" id="nextBtn" style="padding:12px 24px; font-size:16px; display:none;">Weiter ➔</button>
          </div>
          <div class="feedback" id="feedback"></div>
        </div>

        <div class="stats-card">
          <div style="font-weight:bold; margin-bottom:8px; color:#2c3e50;">📊 Profil-Statistik</div>
          <div id="statsList"></div>
          <button class="btn btn-secondary" id="resetBtn" style="margin-top:10px; width:100%; font-size:12px;">Statistik leeren</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ---------------- Audio ---------------- */
function speak(text){
  try{
    if('speechSynthesis' in window){
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'de-DE'; u.rate = 1.0;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}

/* ---------------- SVG Zeichner ---------------- */
function drawClock(h, m) {
  const hAngle = ((h % 12) + m/60) * 30 - 90;
  const mAngle = m * 6 - 90;
  const hx = 50 + 20 * Math.cos(hAngle*Math.PI/180);
  const hy = 50 + 20 * Math.sin(hAngle*Math.PI/180);
  const mx = 50 + 32 * Math.cos(mAngle*Math.PI/180);
  const my = 50 + 32 * Math.sin(mAngle*Math.PI/180);
  
  let ticks = '';
  for(let i=0; i<12; i++){
    const a = (i*30-90)*Math.PI/180;
    const x1 = 50 + 40*Math.cos(a), y1 = 50 + 40*Math.sin(a);
    const x2 = 50 + 45*Math.cos(a), y2 = 50 + 45*Math.sin(a);
    ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#34495e" stroke-width="${i%3===0?3:1}"/>`;
  }

  return `
    <svg width="120" height="120" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="white" stroke="#bdc3c7" stroke-width="4"/>
      ${ticks}
      <line x1="50" y1="50" x2="${hx}" y2="${hy}" stroke="#2c3e50" stroke-width="4" stroke-linecap="round"/>
      <line x1="50" y1="50" x2="${mx}" y2="${my}" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/>
      <circle cx="50" cy="50" r="3" fill="#2c3e50"/>
    </svg>`;
}

function drawShape(type) {
  let paths = '';
  if (type === 'cube') {
    paths = `
      <path d="M50 15 L85 30 L85 75 L50 90 L15 75 L15 30 Z" fill="#3498db" stroke="#1b6fab" stroke-width="2"/>
      <path d="M50 15 L15 30 L50 45 L85 30 Z" fill="#85c1e9" stroke="#1b6fab" stroke-width="2"/>
      <path d="M50 45 L50 90" stroke="#1b6fab" stroke-width="2"/>
    `;
  } else if (type === 'cylinder') {
    paths = `
      <path d="M25 30 L25 75 A 25 10 0 0 0 75 75 L75 30 Z" fill="#3498db" stroke="#1b6fab" stroke-width="2"/>
      <ellipse cx="50" cy="30" rx="25" ry="10" fill="#85c1e9" stroke="#1b6fab" stroke-width="2"/>
      <ellipse cx="50" cy="75" rx="25" ry="10" fill="none" stroke="#1b6fab" stroke-width="2" stroke-dasharray="4,4"/>
    `;
  }
  return `<svg width="120" height="120" viewBox="0 0 100 100">${paths}</svg>`;
}

function drawNumberLine(num, isHundred) {
  const step = isHundred ? 100 : 10;
  const lower = Math.floor(num/step)*step;
  const upper = lower + step;
  const percent = ((num - lower) / step) * 100;
  
  return `
    <svg width="280" height="60" viewBox="0 0 280 60">
      <line x1="20" y1="30" x2="260" y2="30" stroke="#7f8c8d" stroke-width="4"/>
      <line x1="20" y1="20" x2="20" y2="40" stroke="#2c3e50" stroke-width="4"/>
      <line x1="260" y1="20" x2="260" y2="40" stroke="#2c3e50" stroke-width="4"/>
      <text x="20" y="55" font-size="16" font-family="Arial" font-weight="bold" text-anchor="middle" fill="#2c3e50">${lower}</text>
      <text x="260" y="55" font-size="16" font-family="Arial" font-weight="bold" text-anchor="middle" fill="#2c3e50">${upper}</text>
      <circle cx="${20 + (percent*2.4)}" cy="30" r="8" fill="#e74c3c"/>
      <text x="${20 + (percent*2.4)}" y="15" font-size="16" font-family="Arial" font-weight="bold" text-anchor="middle" fill="#e74c3c">${num}</text>
    </svg>`;
}

/* ---------------- Aufgaben-Module ---------------- */
const tasks = {
  hze: {
    title: "Stellenwerte HZE", sub: "Zahlenraum zerlegen",
    gen() {
      const n = randInt(111, 999);
      return {
        q: `Zerlege die Zahl: ${n}`,
        html: `
          <div style="font-size:20px; font-weight:bold; margin-bottom:10px;">
            <span style="color:#e74c3c">H</span> <span style="color:#27ae60">Z</span> <span style="color:#2980b9">E</span>
          </div>
          <div>
            <input type="number" class="std-input" id="inp_h" placeholder="H" style="color:#e74c3c">
            <input type="number" class="std-input" id="inp_z" placeholder="Z" style="color:#27ae60">
            <input type="number" class="std-input" id="inp_e" placeholder="E" style="color:#2980b9">
          </div>`,
        ids: ['inp_h', 'inp_z', 'inp_e'],
        sol: [Math.floor(n/100), Math.floor((n%100)/10), n%10]
      };
    }
  },
  
  runden: {
    title: "Runden", sub: "Auf Zehner/Hunderter",
    gen() {
      const isHundred = Math.random() > 0.5;
      const n = randInt(111, 888);
      let sol;
      if(isHundred){
        const r = n % 100; sol = n + (100-r >= 50 && r >=50 ? 100-r : (r>=50 ? 100-r : -r));
      } else {
        const r = n % 10; sol = n + (10-r >= 5 && r >=5 ? 10-r : (r>=5 ? 10-r : -r));
      }
      return {
        q: `Runde auf den nächsten ${isHundred ? 'Hunderter' : 'Zehner'}!`,
        hint: `Tipp: Bei 0-4 wird abgerundet, ab 5 aufgerundet.`,
        html: `
          ${drawNumberLine(n, isHundred)}
          <br><input type="number" class="std-input" id="inp_1" placeholder="Runden">
        `,
        ids: ['inp_1'], sol: [sol]
      };
    }
  },

  mauer: {
    title: "Zahlenmauer", sub: "Optische Pyramide",
    gen() {
      // Basis-Steine
      const a=randInt(10,50), b=randInt(10,50), c=randInt(10,50);
      // Mitte
      const d=a+b, e=b+c;
      // Spitze
      const f=d+e;
      
      return {
        q: `Baue die Zahlenmauer!`,
        hint: "Addiere zwei nebeneinanderliegende Steine für den Stein darüber.",
        html: `
          <!-- Spitze -->
          <div class="mauer-row"><div class="brick"><input id="inp_1" type="number"></div></div>
          <!-- Mitte -->
          <div class="mauer-row">
            <div class="brick"><input id="inp_2" type="number"></div>
            <div class="brick"><input id="inp_3" type="number"></div>
          </div>
          <!-- Basis -->
          <div class="mauer-row">
            <div class="brick">${a}</div><div class="brick">${b}</div><div class="brick">${c}</div>
          </div>
        `,
        // Lösungs-Reihenfolge muss exakt zu den IDs passen
        // inp_1 = Spitze (f), inp_2 = Mitte links (d), inp_3 = Mitte rechts (e)
        ids: ['inp_1', 'inp_2', 'inp_3'],
        sol: [f, d, e]
      };
    }
  },

  tausender: {
    title: "Tausenderbuch", sub: "Nachbarzahlen",
    gen() {
      let n = randInt(120, 880);
      while(n%10===0 || n%10===9) n = randInt(120,880); 
      return {
        q: "Finde die Nachbarn im Buch!",
        hint: "Oben = -10, Unten = +10, Links = -1, Rechts = +1",
        html: `
          <div class="tausender-cross">
            <div></div><div class="t-cell"><input type="number" id="inp_1" class="t-input" placeholder="Oben"></div><div></div>
            <div class="t-cell"><input type="number" id="inp_2" class="t-input" placeholder="Links"></div>
            <div class="t-cell t-center">${n}</div>
            <div class="t-cell"><input type="number" id="inp_3" class="t-input" placeholder="Rechts"></div>
            <div></div><div class="t-cell"><input type="number" id="inp_4" class="t-input" placeholder="Unten"></div><div></div>
          </div>
        `,
        ids: ['inp_1', 'inp_2', 'inp_3', 'inp_4'],
        sol: [n-10, n-1, n+1, n+10]
      };
    }
  },

  zeit: {
    title: "Uhrzeit", sub: "Mit analoger Uhr",
    gen() {
      const h=randInt(7,16), m=[0,15,30,45][randInt(0,3)], d=[15,30,45,60][randInt(0,3)];
      const total = h*60 + m + d;
      return {
        q: `Es ist ${h}:${m==0?'00':m} Uhr.`,
        hint: `Das Kino dauert ${d} Minuten. Wann ist es aus?`,
        html: `
          ${drawClock(h, m)}
          <br>
          <input type="number" class="std-input" id="inp_h" placeholder="Std" style="width:70px"> : 
          <input type="number" class="std-input" id="inp_m" placeholder="Min" style="width:70px">
        `,
        ids: ['inp_h', 'inp_m'],
        sol: [Math.floor(total/60)%24, total%60]
      };
    }
  },

  geometrie: {
    title: "Geometrie", sub: "Körper erkennen",
    gen() {
      const isCube = Math.random() > 0.5;
      const t = isCube ? 'cube' : 'cylinder';
      const q = isCube ? "Wie viele Ecken hat dieser Körper (Würfel)?" : "Wie viele Flächen hat dieser Körper (Zylinder)?";
      const s = isCube ? 8 : 3;
      return {
        q: q,
        hint: isCube ? "Zähle alle spitzen Ecken." : "Oben, unten und die Außenhülle.",
        html: `
          ${drawShape(t)}
          <br><input type="number" class="std-input" id="inp_1">
        `,
        ids: ['inp_1'], sol: [s]
      };
    }
  },

  rechnen: {
    title: "Kopfrechnen", sub: "Grundrechenarten",
    gen() {
      const op = ['+','-','*'][randInt(0,2)];
      let a,b,s;
      if(op==='+'){ a=randInt(50,500); b=randInt(20,400); s=a+b; }
      else if(op==='-'){ a=randInt(200,900); b=randInt(20,a-50); s=a-b; }
      else { a=randInt(2,10); b=randInt(2,10); s=a*b; }
      return {
        q: `${a} ${op==='*'?'×':op} ${b} = ?`,
        html: `<input type="number" class="std-input" id="inp_1">`,
        ids: ['inp_1'], sol: [s]
      };
    }
  }
};

/* ---------------- System-Logik ---------------- */
let profiles={}, curProfId=null, curTaskKey=null, curInstance=null;

function loadStorage(){
  try{ profiles = JSON.parse(localStorage.getItem('m_app_v3')) || {}; }catch(e){}
  if(Object.keys(profiles).length===0) profiles['p1']={name:'Kind 1',score:0,stats:{}};
  curProfId = Object.keys(profiles)[0];
  saveStorage();
}
function saveStorage(){ localStorage.setItem('m_app_v3', JSON.stringify(profiles)); }

function initUI(){
  const s = document.getElementById('profileSelect');
  s.innerHTML = '';
  for(const [id, p] of Object.entries(profiles)) s.innerHTML+=`<option value="${id}">${p.name}</option>`;
  s.value = curProfId;
  
  const g = document.getElementById('taskTiles');
  g.innerHTML = '';
  for(const [k, v] of Object.entries(tasks)){
    g.innerHTML+=`<div class="tile" onclick="openTask('${k}')">
      <div class="tile-title">${v.title}</div><div class="tile-sub">${v.sub}</div>
    </div>`;
  }
  updateUI();
}

function updateUI(){
  const p = profiles[curProfId];
  document.getElementById('scoreText').textContent = `Punkte: ${p.score}`;
  document.getElementById('starsText').textContent = '★'.repeat(Math.min(5,Math.floor(p.score/50))) + '☆'.repeat(5-Math.min(5,Math.floor(p.score/50)));
  
  const sl = document.getElementById('statsList');
  sl.innerHTML = '';
  for(const [k, v] of Object.entries(tasks)){
    const st = p.stats[k] || {c:0,t:0};
    const pct = st.t>0 ? Math.round((st.c/st.t)*100) : 0;
    sl.innerHTML += `
      <div class="stats-row">
        <span style="width:110px">${v.title}</span>
        <div class="stats-bar"><div class="stats-fill" style="width:${pct}%"></div></div>
        <span style="width:30px; text-align:right">${pct}%</span>
      </div>
    `;
  }
}

function openTask(k){
  curTaskKey = k;
  document.getElementById('taskTitle').textContent = tasks[k].title;
  genTask();
}

function genTask(){
  curInstance = tasks[curTaskKey].gen();
  document.getElementById('tQuestion').innerHTML = curInstance.q;
  document.getElementById('tHint').innerHTML = curInstance.hint || '';
  document.getElementById('tVisual').innerHTML = curInstance.html;
  
  document.getElementById('feedback').textContent = '';
  document.getElementById('checkBtn').style.display = 'inline-block';
  document.getElementById('checkBtn').disabled = false;
  document.getElementById('nextBtn').style.display = 'none';
  
  // Enter-Taste
  curInstance.ids.forEach(id => {
    const el = document.getElementById(id);
    if(el) el.addEventListener('keypress', e => { if(e.key === 'Enter') check(); });
  });
  
  const firstInput = document.getElementById(curInstance.ids[0]);
  if(firstInput) firstInput.focus();
}

function check(){
  let allCorrect = true;
  curInstance.ids.forEach((id, idx) => {
    const val = parseInt(document.getElementById(id).value);
    if(isNaN(val) || val !== curInstance.sol[idx]) allCorrect = false;
  });

  const p = profiles[curProfId];
  if(!p.stats[curTaskKey]) p.stats[curTaskKey]={c:0,t:0};
  p.stats[curTaskKey].t++;

  const fb = document.getElementById('feedback');
  if(allCorrect){
    fb.innerHTML = 'Richtig! Super! 🎉'; fb.className='feedback ok';
    speak("Super gemacht, weiter so!");
    p.stats[curTaskKey].c++;
    p.score+=10;
    document.getElementById('checkBtn').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'inline-block';
    document.getElementById('nextBtn').focus();
  } else {
    fb.innerHTML = 'Nicht ganz. Versuch es nochmal! 💪'; fb.className='feedback bad';
    speak("Leider falsch, probiere es nochmal.");
  }
  saveStorage(); updateUI();
}

// Event Listeners
document.getElementById('profileSelect').onchange = e => { curProfId = e.target.value; updateUI(); };
document.getElementById('checkBtn').onclick = check;
document.getElementById('nextBtn').onclick = genTask;
document.getElementById('addBtn').onclick = () => {
  const n = prompt('Name:'); if(n){ profiles['p'+Date.now()]={name:n,score:0,stats:{}}; initUI(); }
};
document.getElementById('delBtn').onclick = () => {
  if(Object.keys(profiles).length>1 && confirm('Profil löschen?')){ delete profiles[curProfId]; curProfId=Object.keys(profiles)[0]; initUI(); }
};
document.getElementById('resetBtn').onclick = () => {
  if(confirm('Statistik für dieses Kind leeren?')){ profiles[curProfId].score=0; profiles[curProfId].stats={}; saveStorage(); updateUI(); }
};

loadStorage(); initUI();
</script>
</body>
</html>
