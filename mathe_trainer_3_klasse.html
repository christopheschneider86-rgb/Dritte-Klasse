<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Mathe-Trainer 3. Klasse Bayern</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<link rel="icon" type="image/png" href="main.png">
<link rel="apple-touch-icon" href="main.png">
<style>
:root {
  --bg: #e9f4ff; --card: #ffffff; --accent: #3498db; --accent-soft: #d6ecff;
  --danger: #e74c3c; --success: #27ae60; --warning: #f1c40f; --text: #222222; --muted: #666666;
  --radius: 18px;
}
*{box-sizing:border-box;margin:0;padding:0; -webkit-tap-highlight-color: transparent;}
body{
  font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; display: flex; justify-content: center;
  touch-action: manipulation;
}
.app{ width:100%; max-width:1100px; padding:12px; }
@media(min-width: 768px) { .app { padding: 24px; } .card { padding: 24px; } }

.card{ background:var(--card); border-radius:var(--radius); box-shadow:0 8px 24px rgba(0,0,0,0.08); padding:16px; }
.header{ display:flex; align-items:center; gap:16px; margin-bottom:14px; position: relative;}

.back-home{
  background: #ecf0f1; border: none; border-radius: 12px; padding: 10px 12px;
  cursor: pointer; color: var(--text); display: flex; align-items: center; justify-content: center; transition: background 0.2s; text-decoration: none;
}
.back-home svg { width: 24px; height: 24px; }
.back-home:hover{ background: #bdc3c7; }

.app-icon{ width:64px; height:64px; border-radius:16px; object-fit:cover; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
.header-text h1{ font-size:22px; margin-bottom:4px; color:#2c3e50; }
.header-text p{ font-size:14px; color:var(--muted); }

.profile-bar, .score-bar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px; }
.score-bar{ padding:12px 16px; border-radius:16px; background:var(--accent-soft); font-size:14px; }
.score-bar strong{ font-size:18px; color:#1b6fab; display:flex; align-items:center; gap:6px;}

.stars{ color:#f39c12; display:flex; gap: 4px; }
.star-icon { width: 26px; height: 26px; fill: currentColor; }
.star-empty { fill: none; stroke: currentColor; stroke-width: 2;}

select, .btn{ padding:12px 18px; border-radius:12px; font-size:15px; border:none; cursor:pointer; display:flex; align-items:center; gap:8px; justify-content:center; min-height: 44px;}
select{ border:1px solid #ccd8e6; background:#f8fbff; font-weight:bold; font-size: 16px;}
.btn-primary{ background:var(--accent); color:white; font-weight:bold; }
.btn-secondary{ background:#ecf0f1; color:var(--text); }
.btn-outline{ background:white; border:2px solid var(--accent); color:var(--accent); font-weight:bold;}
.btn:active{ transform:scale(0.96); }
.btn svg { width: 20px; height: 20px; }

.speaker-btn {
  background: var(--accent-soft); color: var(--accent); border: none; border-radius: 50%;
  width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: transform 0.2s; flex-shrink: 0;
}
.speaker-btn svg { width: 22px; height: 22px; }
.speaker-btn:active { transform: scale(0.9); }

.main-layout{ display:grid; grid-template-columns: 1fr 1.2fr; gap:20px; align-items: start;}
@media(max-width: 900px){ .main-layout{ grid-template-columns:1fr; } .header-text h1{ font-size: 18px; } .app-icon { width: 48px; height: 48px; } }

.tile-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:12px; }
.tile{ background:#f7fbff; border-radius:14px; padding:16px 12px; border:2px solid #d9e8f7; cursor:pointer; transition:all .2s; min-height:90px; display:flex; flex-direction:column; justify-content: center; align-items: center; text-align: center; }
.tile:hover, .tile.active{ border-color:var(--accent); background:#edf5fc; transform:translateY(-2px); box-shadow: 0 4px 10px rgba(52, 152, 219, 0.15);}
.tile-title{ font-size:15px; font-weight:bold; margin-bottom:4px; color:#2c3e50; }
.tile-sub{ font-size:12px; color:var(--muted); }

.panel-title{ font-size:20px; font-weight:bold; margin-bottom:12px; color:#2c3e50; display:flex; align-items:center; gap:8px;}

.view-container { display: none; }
.view-container.active { display: block; }

.task-box{ padding:24px; border-radius:16px; background:#fdfdfd; border:2px solid #e1e8f0; text-align:center; box-shadow:inset 0 2px 10px rgba(0,0,0,0.02); }
.question-wrapper { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 12px; }
.task-question{ font-size:24px; font-weight:bold; color:#2c3e50; line-height:1.4;}
.visual-container{ margin:20px 0; display:flex; flex-direction: column; align-items:center; }
.task-hint{ font-size:15px; color:var(--muted); margin-bottom:20px; display:flex; justify-content:center; align-items:center; gap:6px;}

.mauer-wrapper{ display:flex; flex-direction:column; align-items:center; gap:6px; margin: 10px 0;}
.mauer-row{ display:flex; justify-content:center; gap:8px; }
.brick{ width:80px; height:50px; background:#e67e22; border-radius:8px; border:2px solid #d35400; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:bold; color:white; box-shadow:0 4px 0 #b33c00; }
.brick input{ width:100%; height:100%; border:none; background:white; border-radius:6px; text-align:center; font-size:22px; font-weight:bold; color:#d35400; }
.brick input:focus{ outline:none; box-shadow:inset 0 0 0 3px #f1c40f; }

.tausender-cross{ display:grid; grid-template-columns: 65px 65px 65px; gap:8px; justify-content:center; }
.t-cell{ width:65px; height:65px; border-radius:10px; }
.t-center{ background:#3498db; color:white; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:bold; box-shadow:0 4px 0 #2980b9;}
.t-input{ width:100%; height:100%; text-align:center; font-size:22px; font-weight:bold; border:2px solid #bdc3c7; border-radius:10px; background:#fff; }
.t-input:focus{ border-color:#3498db; outline:none; }

.std-input{ width:120px; padding:12px; font-size:26px; font-weight:bold; text-align:center; border:3px solid #ccd8e6; border-radius:14px; margin:0 5px; }
.std-input:focus{ border-color:#3498db; outline:none; }

.feedback{ margin-top:20px; font-size:18px; font-weight:bold; min-height:28px; display:flex; justify-content:center; align-items:center; gap:8px;}
.feedback.ok{ color:var(--success); }
.feedback.bad{ color:var(--danger); }

.dashboard-box { background: #fdfdfd; border: 2px solid #e1e8f0; border-radius: 16px; padding: 24px; margin-top: 10px; }
.filter-tabs { display:flex; gap:10px; margin-bottom: 20px; background: #ecf0f1; padding: 6px; border-radius: 12px; }
.filter-tab { flex: 1; text-align: center; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; color: var(--muted); }
.filter-tab.active { background: white; color: var(--accent); box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
.kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
.kpi-card { background: #f7fbff; border-radius: 12px; padding: 15px; text-align: center; border: 1px solid #d9e8f7; }
.kpi-value { font-size: 32px; font-weight: bold; color: #2c3e50; margin: 5px 0; }
.kpi-label { font-size: 13px; color: var(--muted); }
.analysis-section { margin-top: 20px; text-align: left; }
.analysis-section h3 { font-size: 16px; color: #2c3e50; margin-bottom: 12px; padding-bottom: 5px; border-bottom: 2px solid #ecf0f1; }
.topic-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #fff; border: 1px solid #ecf0f1; border-radius: 8px; margin-bottom: 8px; }
.topic-name { font-weight: bold; font-size: 14px; color: #2c3e50; }
.topic-stats { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <div class="header">
      <a href="index.html" class="back-home" title="Zurück">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      </a>
      <img src="main.png" class="app-icon" alt="Icon" onerror="this.style.display='none'">
      <div class="header-text">
        <h1>Mathe-Trainer 3. Klasse</h1>
        <p>LehrplanPLUS Bayern</p>
      </div>
    </div>

    <div class="profile-bar">
      <div><select id="profileSelect" onchange="switchProfile()"></select></div>
      <div style="display:flex; gap:6px;">
        <button class="btn btn-outline" onclick="toggleDashboard()">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
          <span id="dashBtnText">Eltern-Stats</span>
        </button>
        <button class="btn btn-secondary" onclick="addProfile()">Neues Kind</button>
      </div>
    </div>

    <!-- ÜBUNGS-MODUS -->
    <div id="view-practice" class="view-container active">
      <div class="score-bar">
        <div><strong><span id="scoreText">Punkte: 0</span></strong></div>
        <div class="stars" id="starsText"></div>
      </div>
      <div class="main-layout">
        <div>
          <div class="panel-title">Themengebiete</div>
          <div class="tile-grid" id="taskTiles"></div>
        </div>
        <div>
          <div class="panel-title" id="taskTitle">Aktuelle Aufgabe</div>
          <div class="task-box">
            <div class="question-wrapper">
              <div class="task-question" id="tQuestion">Wähle links ein Thema!</div>
              <button class="speaker-btn" id="readBtn" style="display:none;" title="Vorlesen" onclick="speakCurrent()">
                <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z" />
                </svg>
              </button>
            </div>
            <div class="visual-container" id="tVisual"></div>
            <div class="task-hint" id="tHint"></div>
            <div style="margin-top:15px; display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
              <button class="btn btn-primary" id="checkBtn" disabled onclick="checkAnswer()">Antwort prüfen</button>
              <button class="btn btn-secondary" id="nextBtn" style="display:none;" onclick="nextTask()">Nächste Aufgabe ➔</button>
            </div>
            <div class="feedback" id="feedback"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ELTERN-DASHBOARD -->
    <div id="view-dashboard" class="view-container">
      <div class="panel-title" style="margin-top:10px;">Lernfortschritt &amp; Auswertung</div>
      <div class="dashboard-box">
        <div class="filter-tabs">
          <div class="filter-tab active" onclick="updateDashboard('today',this)">Heute</div>
          <div class="filter-tab" onclick="updateDashboard('week',this)">Letzte 7 Tage</div>
          <div class="filter-tab" onclick="updateDashboard('all',this)">Gesamtzeit</div>
        </div>
        <div class="kpi-grid">
          <div class="kpi-card"><div class="kpi-label">Gelöste Aufgaben</div><div class="kpi-value" id="dash-total">0</div></div>
          <div class="kpi-card"><div class="kpi-label">Erfolgsquote</div><div class="kpi-value" id="dash-quote">0%</div></div>
        </div>
        <div class="analysis-section"><h3>🟢 Stärken (Läuft super)</h3><div id="dash-good"></div></div>
        <div class="analysis-section"><h3>🟡 Übungsbedarf (Geht so)</h3><div id="dash-medium"></div></div>
        <div class="analysis-section"><h3>🔴 Problemzonen (Hier intensivieren)</h3><div id="dash-bad"></div></div>
        <button class="btn btn-secondary" style="width:100%; margin-top:30px; font-size:13px;" onclick="resetStats()">Fortschritt für dieses Kind löschen</button>
      </div>
    </div>
  </div>
</div>

<script>
// ─── HELPERS ──────────────────────────────────────────────────────────────────
function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function speak(text){ try{ if('speechSynthesis' in window){ window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='de-DE'; u.rate=0.9; window.speechSynthesis.speak(u); }}catch(e){} }
function stripHTML(html){ const d=document.createElement("DIV"); d.innerHTML=html; return d.textContent||d.innerText||""; }

// ─── SVG ──────────────────────────────────────────────────────────────────────
function drawClock(h, m) {
  const hA=((h%12)+m/60)*30-90, mA=m*6-90;
  const hx=50+20*Math.cos(hA*Math.PI/180), hy=50+20*Math.sin(hA*Math.PI/180);
  const mx=50+32*Math.cos(mA*Math.PI/180), my=50+32*Math.sin(mA*Math.PI/180);
  let ticks='';
  for(let i=0;i<12;i++){ const a=(i*30-90)*Math.PI/180; ticks+=`<line x1="${50+40*Math.cos(a)}" y1="${50+40*Math.sin(a)}" x2="${50+45*Math.cos(a)}" y2="${50+45*Math.sin(a)}" stroke="#34495e" stroke-width="${i%3===0?3:1}"/>`; }
  return `<svg width="130" height="130" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="white" stroke="#bdc3c7" stroke-width="4"/>${ticks}<line x1="50" y1="50" x2="${hx}" y2="${hy}" stroke="#2c3e50" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="50" x2="${mx}" y2="${my}" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="50" r="3" fill="#2c3e50"/></svg>`;
}
function drawShape(type) {
  let p='';
  if(type==='cube') p=`<path d="M50 15 L85 30 L85 75 L50 90 L15 75 L15 30 Z" fill="#3498db" stroke="#1b6fab" stroke-width="2"/><path d="M50 15 L15 30 L50 45 L85 30 Z" fill="#85c1e9" stroke="#1b6fab" stroke-width="2"/><path d="M50 45 L50 90" stroke="#1b6fab" stroke-width="2"/>`;
  else if(type==='cylinder') p=`<path d="M25 30 L25 75 A 25 10 0 0 0 75 75 L75 30 Z" fill="#3498db" stroke="#1b6fab" stroke-width="2"/><ellipse cx="50" cy="30" rx="25" ry="10" fill="#85c1e9" stroke="#1b6fab" stroke-width="2"/><ellipse cx="50" cy="75" rx="25" ry="10" fill="none" stroke="#1b6fab" stroke-width="2" stroke-dasharray="4,4"/>`;
  else if(type==='rect') p=`<rect x="20" y="30" width="60" height="40" fill="#3498db" stroke="#1b6fab" stroke-width="2"/>`;
  return `<svg width="130" height="130" viewBox="0 0 100 100">${p}</svg>`;
}
function drawNumberLine(num, isHundred) {
  const step=isHundred?100:10;
  const lower=Math.floor(num/step)*step, upper=lower+step;
  const pct=((num-lower)/step)*100;
  return `<svg width="280" height="60" viewBox="0 0 280 60"><line x1="20" y1="30" x2="260" y2="30" stroke="#7f8c8d" stroke-width="4"/><line x1="20" y1="20" x2="20" y2="40" stroke="#2c3e50" stroke-width="4"/><line x1="260" y1="20" x2="260" y2="40" stroke="#2c3e50" stroke-width="4"/><text x="20" y="55" font-size="16" font-family="Arial" font-weight="bold" text-anchor="middle" fill="#2c3e50">${lower}</text><text x="260" y="55" font-size="16" font-family="Arial" font-weight="bold" text-anchor="middle" fill="#2c3e50">${upper}</text><circle cx="${20+pct*2.4}" cy="30" r="8" fill="#e74c3c"/><text x="${20+pct*2.4}" y="15" font-size="16" font-family="Arial" font-weight="bold" text-anchor="middle" fill="#e74c3c">${num}</text></svg>`;
}

// ─── AUFGABEN ─────────────────────────────────────────────────────────────────
const tasks = {
  rechnen_gross:{title:"Rechnen",sub:"+ − ×",
    gen(){
      const op=['+','-','*'][randInt(0,2)]; let a,b,s;
      if(op==='+'){a=randInt(150,500);b=randInt(150,400);s=a+b;}
      else if(op==='-'){a=randInt(400,900);b=randInt(110,a-50);s=a-b;}
      else{a=randInt(12,30);b=randInt(3,9);s=a*b;}
      return{q:`${a} ${op==='*'?'×':op} ${b} = ?`,hint:"Rechne halbschriftlich oder im Kopf.",
        html:`<input type="number" class="std-input" id="inp_1">`,ids:['inp_1'],sol:[s],isFloat:false};
    }
  },
  div_rest:{title:"Division",sub:"mit Rest",
    gen(){
      let a=randInt(15,89),b=randInt(3,9);
      while(a%b===0){a=randInt(15,89);}
      return{q:`${a} : ${b} = ?`,hint:"Trage Ergebnis und Rest ein.",
        html:`<div style="display:flex;align-items:center;gap:10px;justify-content:center;"><input type="number" class="std-input" id="inp_1" placeholder="Erg" style="width:90px;"><span style="font-size:24px;font-weight:bold;">R</span><input type="number" class="std-input" id="inp_2" placeholder="Rest" style="width:90px;"></div>`,
        ids:['inp_1','inp_2'],sol:[Math.floor(a/b),a%b],isFloat:false};
    }
  },
  geld_komma:{title:"Geld",sub:"Rechnen & Umwandeln",
    gen(){
      const type=randInt(0,3);
      if(type===0){
        let a=randInt(1,10)+([10,20,25,50,75,80][randInt(0,5)])/100;
        let b=randInt(1,5)+([10,20,25,50,75,80][randInt(0,5)])/100;
        const op=['+','-'][randInt(0,1)];
        if(op==='-'&&a<b){let t=a;a=b;b=t;}
        const s=op==='+'?a+b:a-b;
        return{q:`${a.toFixed(2).replace('.',',')} € ${op} ${b.toFixed(2).replace('.',',')} € = ?`,
          hint:"Ergebnis mit Komma (z.B. 3,50).",
          html:`<div style="display:flex;align-items:center;justify-content:center;gap:6px;"><input type="text" class="std-input" id="inp_1" placeholder="0,00" style="width:130px;"><span style="font-size:24px;font-weight:bold;">€</span></div>`,
          ids:['inp_1'],sol:[s],isFloat:true};
      } else if(type===1){
        const ct=randInt(1,9)*100+[0,5,10,20,50,75,90,99][randInt(0,7)];
        return{q:`${ct} ct = ? €`,hint:"100 ct = 1,00 €",
          html:`<div style="display:flex;align-items:center;justify-content:center;gap:6px;"><input type="text" class="std-input" id="inp_1" placeholder="0,00" style="width:130px;"><span style="font-size:24px;font-weight:bold;">€</span></div>`,
          ids:['inp_1'],sol:[ct/100],isFloat:true};
      } else if(type===2){
        const eur=randInt(1,15), ct=[5,10,25,50,80,95][randInt(0,5)];
        return{q:`${eur} € ${ct} ct = ? €`,hint:"Schreibe als Kommazahl.",
          html:`<div style="display:flex;align-items:center;justify-content:center;gap:6px;"><input type="text" class="std-input" id="inp_1" placeholder="0,00" style="width:130px;"><span style="font-size:24px;font-weight:bold;">€</span></div>`,
          ids:['inp_1'],sol:[eur+ct/100],isFloat:true};
      } else {
        const eur=randInt(1,12), ct=[0,5,10,25,50,75,90][randInt(0,6)];
        const val=eur+ct/100;
        return{q:`${val.toFixed(2).replace('.',',')} € = ? ct`,hint:"Wie viele Cent insgesamt?",
          html:`<div style="display:flex;align-items:center;justify-content:center;gap:6px;"><input type="number" class="std-input" id="inp_1" style="width:130px;"><span style="font-size:24px;font-weight:bold;">ct</span></div>`,
          ids:['inp_1'],sol:[eur*100+ct],isFloat:false};
      }
    }
  },
  masse_laengen:{title:"Größen",sub:"m, cm, kg",
    gen(){
      const v=randInt(0,3); let q,hint,s;
      if(v===0){const m=randInt(2,9);q=`${m} m = ? cm`;hint="1 m = 100 cm";s=m*100;}
      else if(v===1){const cm=randInt(20,90);q=`${cm} cm = ? mm`;hint="1 cm = 10 mm";s=cm*10;}
      else if(v===2){const mm=randInt(2,9)*10;q=`${mm} mm = ? cm`;hint="10 mm = 1 cm";s=mm/10;}
      else{const kg=randInt(2,8);q=`${kg} kg = ? g`;hint="1 kg = 1000 g";s=kg*1000;}
      return{q,hint,html:`<input type="number" class="std-input" id="inp_1">`,ids:['inp_1'],sol:[s],isFloat:false};
    }
  },
  sachaufgaben:{title:"Textaufgaben",sub:"Lesen",
    gen(){
      const v=randInt(0,2); let q,s;
      if(v===0){const a=randInt(20,40),b=randInt(5,15);q=`Im Bus sind ${a} Leute. Es steigen ${b} aus. Wie viele sind es noch?`;s=a-b;}
      else if(v===1){const a=randInt(4,8),b=randInt(3,6);q=`Tom kauft ${a} Eis für je ${b} Euro. Wie viel Euro zahlt er?`;s=a*b;}
      else{const a=randInt(3,6)*10;q=`Ein Seil ist ${a} cm lang. Lisa schneidet die Hälfte ab. Rest in cm?`;s=a/2;}
      return{q:`<div style="font-size:18px;line-height:1.4;">${q}</div>`,hint:"Überlege: Plus, Minus, Mal oder Geteilt?",
        html:`<input type="number" class="std-input" id="inp_1">`,ids:['inp_1'],sol:[s],isFloat:false};
    }
  },
  geometrie:{title:"Geometrie",sub:"Körper",
    gen(){
      const v=randInt(0,3); let t,q,hint,s;
      if(v===0){t='cube';q="Wie viele Ecken hat ein Würfel?";hint="Spitze Ecken zählen.";s=8;}
      else if(v===1){t='cube';q="Wie viele Kanten hat ein Würfel?";hint="Alle Linien zählen.";s=12;}
      else if(v===2){t='cylinder';q="Wie viele Flächen hat ein Zylinder?";hint="Oben, unten, Außenhülle.";s=3;}
      else{t='rect';q="Wie viele Ecken hat ein Rechteck?";hint="Flache Figur.";s=4;}
      return{q,hint,html:`${drawShape(t)}<br><input type="number" class="std-input" id="inp_1">`,ids:['inp_1'],sol:[s],isFloat:false};
    }
  },
  mauer:{title:"Zahlenmauer",sub:"Pyramide",
    gen(){
      const b1=randInt(10,40),b2=randInt(10,40),b3=randInt(10,40);
      const m1=b1+b2,m2=b2+b3,top=m1+m2;
      const vals=[top,m1,m2,b1,b2,b3];
      const hidden=[];
      while(hidden.length<3){const r=randInt(0,5);if(!hidden.includes(r))hidden.push(r);}
      let htmls=['','','','','',''], inputIds=[], solutions=[];
      for(let i=0;i<6;i++){
        if(hidden.includes(i)){const id=`inp_m_${i}`;inputIds.push(id);solutions.push(vals[i]);htmls[i]=`<div class="brick"><input id="${id}" type="number"></div>`;}
        else htmls[i]=`<div class="brick">${vals[i]}</div>`;
      }
      return{q:"Fülle die Lücken!",hint:"Zwei Steine ergeben den Stein darüber.",
        html:`<div class="mauer-wrapper"><div class="mauer-row">${htmls[0]}</div><div class="mauer-row">${htmls[1]}${htmls[2]}</div><div class="mauer-row">${htmls[3]}${htmls[4]}${htmls[5]}</div></div>`,
        ids:inputIds,sol:solutions,isFloat:false};
    }
  },
  tausender:{title:"Zahlenraum",sub:"Tausenderbuch",
    gen(){
      let n=randInt(120,880);
      while(n%10===0||n%10===9) n=randInt(120,880);
      return{q:"Nachbarn im Buch?",hint:"Oben −10, Unten +10, Links −1, Rechts +1",
        html:`<div class="tausender-cross"><div></div><div class="t-cell"><input type="number" id="inp_1" class="t-input" placeholder="−10"></div><div></div><div class="t-cell"><input type="number" id="inp_2" class="t-input" placeholder="−1"></div><div class="t-cell t-center">${n}</div><div class="t-cell"><input type="number" id="inp_3" class="t-input" placeholder="+1"></div><div></div><div class="t-cell"><input type="number" id="inp_4" class="t-input" placeholder="+10"></div><div></div></div>`,
        ids:['inp_1','inp_2','inp_3','inp_4'],sol:[n-10,n-1,n+1,n+10],isFloat:false};
    }
  },
  hze:{title:"Stellenwerte",sub:"H, Z, E",
    gen(){
      const n=randInt(111,999);
      return{q:`Zerlege die Zahl: ${n}`,hint:"Hunderter, Zehner, Einer?",
        html:`<div style="font-size:20px;font-weight:bold;margin-bottom:10px;"><span style="color:#e74c3c">H</span> <span style="color:#27ae60">Z</span> <span style="color:#2980b9">E</span></div><div style="display:flex;justify-content:center;"><input type="number" class="std-input" id="inp_h" placeholder="H" style="color:#e74c3c;width:80px;"><input type="number" class="std-input" id="inp_z" placeholder="Z" style="color:#27ae60;width:80px;"><input type="number" class="std-input" id="inp_e" placeholder="E" style="color:#2980b9;width:80px;"></div>`,
        ids:['inp_h','inp_z','inp_e'],sol:[Math.floor(n/100),Math.floor((n%100)/10),n%10],isFloat:false};
    }
  },
  runden:{title:"Runden",sub:"Zehner/Hunderter",
    gen(){
      const isHundred=Math.random()>0.5;
      const n=randInt(111,888);
      let sol; const r=isHundred?n%100:n%10; const step=isHundred?100:10;
      sol=r<step/2?n-r:n+(step-r);
      return{q:`Runde ${n} auf den nächsten ${isHundred?'Hunderter':'Zehner'}!`,
        hint:"Bei 0–4 abrunden, ab 5 aufrunden.",
        html:`${drawNumberLine(n,isHundred)}<br><input type="number" class="std-input" id="inp_1" placeholder="Ergebnis">`,
        ids:['inp_1'],sol:[sol],isFloat:false};
    }
  },
  zeit:{title:"Uhrzeit",sub:"Analog lesen",
    gen(){
      const h=randInt(7,16), m=[0,15,30,45][randInt(0,3)], d=[15,30,45,60][randInt(0,3)];
      const total=h*60+m+d;
      const endH=Math.floor(total/60)%24, endM=total%60;
      return{q:`Es ist ${h}:${m===0?'00':m} Uhr.`,
        hint:`Das Kino dauert ${d} Minuten. Wann ist es aus?`,
        html:`${drawClock(h,m)}<br><div style="display:flex;align-items:center;justify-content:center;gap:6px;font-size:22px;font-weight:bold;"><input type="number" class="std-input" id="inp_h" placeholder="Std" style="width:80px;"> : <input type="number" class="std-input" id="inp_m" placeholder="Min" style="width:80px;"></div>`,
        ids:['inp_h','inp_m'],sol:[endH,endM],isFloat:false};
    }
  }
};

// ─── STORAGE ──────────────────────────────────────────────────────────────────
let profiles={}, curProfId=null, curTaskKey=null, curInstance=null, isDashOpen=false, dashPeriod='today';

function loadStorage(){
  try{ const raw=localStorage.getItem('m_app_v9'); if(raw) profiles=JSON.parse(raw); }catch(e){}
  const keys=Object.keys(profiles);
  if(!keys.length||!profiles[keys[0]].hasOwnProperty('history')){
    profiles={'p1':{name:'Kind 1',score:0,history:[]}};
    localStorage.setItem('m_app_v9',JSON.stringify(profiles));
  }
  curProfId=Object.keys(profiles)[0];
}
function saveStorage(){ try{localStorage.setItem('m_app_v9',JSON.stringify(profiles));}catch(e){} }

function switchProfile(){
  curProfId=document.getElementById('profileSelect').value;
  updateUI();
}
function addProfile(){
  const name=prompt("Name des Kindes:");
  if(!name||!name.trim()) return;
  const id='p_'+Date.now();
  profiles[id]={name:name.trim(),score:0,history:[]};
  saveStorage(); initUI();
  document.getElementById('profileSelect').value=id;
  curProfId=id; updateUI();
}

// ─── UI ───────────────────────────────────────────────────────────────────────
function initUI(){
  const s=document.getElementById('profileSelect'); s.innerHTML='';
  for(const [id,p] of Object.entries(profiles)) s.innerHTML+=`<option value="${id}">${p.name}</option>`;
  s.value=curProfId;
  const g=document.getElementById('taskTiles'); g.innerHTML='';
  for(const [k,v] of Object.entries(tasks))
    g.innerHTML+=`<div class="tile" id="tile_${k}" onclick="openTask('${k}')"><div class="tile-title">${v.title}</div><div class="tile-sub">${v.sub}</div></div>`;
  updateUI();
}

function updateUI(){
  const p=profiles[curProfId];
  document.getElementById('scoreText').textContent=`Punkte: ${p.score||0}`;
  const n=Math.min(5,Math.floor((p.score||0)/50));
  let h='';
  for(let i=0;i<5;i++) h+=i<n
    ?`<svg class="star-icon" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`
    :`<svg class="star-icon star-empty" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
  document.getElementById('starsText').innerHTML=h;
}

// ─── AUFGABEN-LOGIK ───────────────────────────────────────────────────────────
function openTask(key){
  curTaskKey=key;
  document.querySelectorAll('.tile').forEach(t=>t.classList.remove('active'));
  const tile=document.getElementById('tile_'+key);
  if(tile) tile.classList.add('active');
  document.getElementById('taskTitle').textContent=tasks[key].title;
  loadTask();
}

function loadTask(){
  curInstance=tasks[curTaskKey].gen();
  const t=curInstance;
  document.getElementById('tQuestion').innerHTML=t.q;
  document.getElementById('tVisual').innerHTML=t.html;
  document.getElementById('tHint').textContent=t.hint||'';
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback';
  document.getElementById('checkBtn').disabled=false;
  document.getElementById('checkBtn').style.display='';
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('readBtn').style.display='';
  setTimeout(()=>{
    t.ids.forEach(id=>{
      const el=document.getElementById(id);
      if(el) el.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!document.getElementById('checkBtn').disabled) checkAnswer(); });
    });
    const first=document.getElementById(t.ids[0]);
    if(first) first.focus();
  },80);
}

function speakCurrent(){
  if(curInstance) speak(stripHTML(curInstance.q)+'. '+(curInstance.hint||''));
}

function checkAnswer(){
  if(!curInstance) return;
  const t=curInstance;
  let allCorrect=true;
  t.ids.forEach((id,i)=>{
    const el=document.getElementById(id); if(!el) return;
    const raw=el.value.trim().replace(',','.');
    const expected=t.sol[i];
    let ok=false;
    if(t.isFloat){ const pv=parseFloat(raw); ok=!isNaN(pv)&&Math.abs(pv-expected)<0.015; }
    else { ok=parseInt(raw,10)===expected; }
    if(!ok) allCorrect=false;
    el.disabled=true;
  });
  const p=profiles[curProfId];
  if(!p.history) p.history=[];
  p.history.push({key:curTaskKey,ok:allCorrect,ts:Date.now()});
  if(allCorrect) p.score=(p.score||0)+10;
  saveStorage(); updateUI();
  const fb=document.getElementById('feedback');
  if(allCorrect){ fb.textContent='✅ Super! Richtig!'; fb.className='feedback ok'; speak('Super! Richtig!'); }
  else { fb.innerHTML=`❌ Nicht ganz. Richtig wäre: <strong>${t.sol.join(' / ')}</strong>`; fb.className='feedback bad'; speak('Nicht ganz. Die Antwort ist '+t.sol.join(' und ')); }
  document.getElementById('checkBtn').style.display='none';
  document.getElementById('nextBtn').style.display='';
}

function nextTask(){ if(curTaskKey) loadTask(); }

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
function toggleDashboard(){
  isDashOpen=!isDashOpen;
  document.getElementById('view-practice').className=isDashOpen?'view-container':'view-container active';
  document.getElementById('view-dashboard').className=isDashOpen?'view-container active':'view-container';
  document.getElementById('dashBtnText').textContent=isDashOpen?'Üben':'Eltern-Stats';
  if(isDashOpen) updateDashboard(dashPeriod);
}

function updateDashboard(period, el){
  dashPeriod=period;
  document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
  if(el) el.classList.add('active');
  const p=profiles[curProfId];
  const now=Date.now();
  const cutoff=period==='today'?now-86400000:period==='week'?now-7*86400000:0;
  const hist=(p.history||[]).filter(h=>h.ts>=cutoff);
  const total=hist.length, correct=hist.filter(h=>h.ok).length;
  document.getElementById('dash-total').textContent=total;
  document.getElementById('dash-quote').textContent=total>0?Math.round(correct/total*100)+'%':'—';
  const byTopic={};
  hist.forEach(h=>{ if(!byTopic[h.key]) byTopic[h.key]={right:0,wrong:0}; if(h.ok) byTopic[h.key].right++; else byTopic[h.key].wrong++; });
  const good=[],medium=[],bad=[];
  for(const [key,stat] of Object.entries(byTopic)){
    const tot=stat.right+stat.wrong, rate=stat.right/tot;
    const name=(tasks[key]||{title:key}).title;
    const row=`<div class="topic-row"><span class="topic-name">${name}</span><span class="topic-stats">${stat.right}/${tot} richtig</span></div>`;
    if(rate>=0.75) good.push(row); else if(rate>=0.4) medium.push(row); else bad.push(row);
  }
  const empty='<p style="color:var(--muted);font-size:14px;">Keine Daten im gewählten Zeitraum.</p>';
  document.getElementById('dash-good').innerHTML=good.length?good.join(''):empty;
  document.getElementById('dash-medium').innerHTML=medium.length?medium.join(''):'<p style="color:var(--muted);font-size:14px;">—</p>';
  document.getElementById('dash-bad').innerHTML=bad.length?bad.join(''):'<p style="color:var(--muted);font-size:14px;">—</p>';
}

function resetStats(){
  if(!confirm(`Wirklich alle Daten für "${profiles[curProfId].name}" löschen?`)) return;
  profiles[curProfId].score=0; profiles[curProfId].history=[];
  saveStorage(); updateUI(); updateDashboard(dashPeriod);
}

// ─── START ────────────────────────────────────────────────────────────────────
loadStorage();
initUI();
</script>
